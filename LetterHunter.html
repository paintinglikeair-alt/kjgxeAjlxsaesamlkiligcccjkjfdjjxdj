<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة صائد الحروف</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #fffbeb; /* خلفية صفراء فاتحة تناسب الأطفال */
            background-image: radial-gradient(#fcd34d 1px, transparent 1px);
            background-size: 20px 20px;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        .game-wrapper {
            background-color: rgba(255, 255, 255, 0.9);
            border: 4px solid #f59e0b;
            padding: 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.2);
            text-align: center;
        }

        /* تنسيقات حاوية اللعبة */
        .balloon-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 400px;
            margin: 0 auto;
            background: linear-gradient(to top, #bae6fd, #e0f2fe); /* سماء متدرجة */
            border-radius: 16px;
            overflow: hidden;
            border: 4px solid #d97706;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        /* تنسيقات البالونات */
        .balloon {
            position: absolute;
            width: 65px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #ef4444, #b91c1c); /* تأثير 3D للبالون */
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 32px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: -2px -2px 10px rgba(0,0,0,0.2) inset, 0 5px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s, opacity 0.3s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* خيط البالون */
        .balloon::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            width: 2px;
            height: 20px;
            background: #ffffff;
            transform: translateX(-50%);
            box-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .balloon:active {
            transform: scale(0.9);
        }

        /* تنسيقات بطل اللعبة (ايموجي) */
        .balloon-hero {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: white;
            border: 3px solid #f59e0b;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
        }

        /* تنسيقات الكلمة المستهدفة */
        .target-word {
            background: white;
            padding: 10px 30px;
            border-radius: 50px;
            font-size: 2.5rem;
            font-weight: 900;
            color: #1e293b;
            border: 4px dashed #f59e0b;
            margin-bottom: 20px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* تنسيقات الرسائل المنبثقة (Toast) */
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            width: 90%;
            max-width: 400px;
        }
        .toast {
            background: linear-gradient(to right, #4f46e5, #ec4899);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s;
            margin-bottom: 10px;
            text-align: center;
            font-size: 1.1rem;
        }
        .toast.error { background: linear-gradient(to right, #ef4444, #b91c1c); }
        .toast.success { background: linear-gradient(to right, #10b981, #047857); }
        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="p-4">

    <!-- حاوية الإشعارات -->
    <div id="toast-container"></div>

    <main class="game-wrapper">
        <div class="flex justify-between items-center mb-4">
            <button onclick="initBalloons()" class="bg-orange-600 hover:bg-orange-500 text-white px-4 py-2 rounded-lg font-bold shadow-md transition border-b-4 border-orange-800 active:scale-95 text-lg">
                إعادة اللعب 🔄
            </button>
            <span class="font-bold text-orange-900 bg-orange-100 px-5 py-2 rounded-full border-2 border-orange-400 text-lg shadow-sm">
                النقاط: <span id="balloon-score" class="text-orange-600 text-xl font-black">0</span>
            </span>
        </div>
        
        <h2 class="text-center text-4xl font-black text-orange-600 mb-2 drop-shadow-sm">صائد الحروف 🎈</h2>
        <p class="text-gray-600 font-bold mb-4">فرقع البالون الذي يحمل الحرف الناقص!</p>
        
        <div class="text-center">
            <div class="target-word" id="balloon-target-word">جاري...</div>
        </div>
        
        <div class="balloon-container" id="balloon-board">
            <!-- سيتم توليد البالونات والبطل هنا بواسطة الجافاسكربت -->
        </div>
    </main>

    <script>
        // المتغيرات الأساسية
        let balloonRunning = false;
        let bScore = 0;
        let animationFrame = null;
        
        // قائمة الكلمات للحصول على تنوع أكبر
        const bWords = [
            {w:"قـ _ ـة", m:"ط", o:["ط","س","م"]}, 
            {w:"أسـ _", m:"د", o:["د","ر","ز"]}, 
            {w:"_ ـفاح", m:"ت", o:["ت","ب","ث"]}, 
            {w:"كـ _ ـاب", m:"ت", o:["ت","ش","ض"]},
            {w:"شـ _ ـرة", m:"ج", o:["ج","ح","خ"]},
            {w:"كـ _ ـب", m:"ل", o:["ل","م","ن"]},
            {w:"عـ _ ـفور", m:"ص", o:["ص","ض","ق"]},
            {w:"_ ـمكة", m:"س", o:["س","ش","ص"]}
        ];
        
        let currentBWord = null;
        let balloons = []; // مصفوفة لتخزين عناصر البالونات الحالية ومواقعها

        // دالة عرض الرسائل المنبثقة
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const t = document.createElement('div');
            
            // تحديد لون الرسالة بناءً على النوع
            let typeClass = '';
            if(type === 'error') typeClass = 'error';
            if(type === 'success') typeClass = 'success';
            
            t.className = `toast ${typeClass}`;
            t.innerText = msg;
            container.appendChild(t);
            
            setTimeout(() => t.classList.add('show'), 10);
            
            setTimeout(() => { 
                t.classList.remove('show'); 
                setTimeout(() => t.remove(), 300); 
            }, 2500);
        }

        // دالة بدء اللعبة
        function initBalloons() {
            cancelAnimationFrame(animationFrame);
            balloonRunning = true;
            bScore = 0;
            document.getElementById('balloon-score').innerText = '0';
            nextBalloonWord();
            updateBalloons(); // بدء حلقة الانيميشن
        }

        // دالة تجهيز الكلمة والبالونات الجديدة
        function nextBalloonWord() {
            // اختيار كلمة عشوائية
            currentBWord = bWords[Math.floor(Math.random() * bWords.length)];
            document.getElementById('balloon-target-word').innerText = currentBWord.w;
            
            const board = document.getElementById('balloon-board');
            
            // تنظيف اللوحة وإضافة البطل
            board.innerHTML = '<div id="balloon-hero" class="balloon-hero">👦</div>';
            
            balloons = [];
            
            // خلط الخيارات عشوائياً حتى لا يكون الترتيب ثابتاً
            let options = [...currentBWord.o].sort(() => Math.random() - 0.5);

            // إنشاء عناصر البالونات (DOM Elements)
            options.forEach((letter, i) => {
                const bDiv = document.createElement('div');
                bDiv.className = 'balloon';
                bDiv.innerText = letter;
                
                // تحديد موقع البداية
                // توزيع أفقي متساوي تقريباً: العرض الإجمالي 400، لدينا 3 بالونات
                let startX = 40 + (i * 110); 
                let startY = 400 + Math.random() * 150; // تأخير الظهور من الأسفل بشكل عشوائي
                
                bDiv.style.left = startX + 'px';
                bDiv.style.top = startY + 'px';
                
                // ألوان مختلفة للبالونات لإضافة بهجة
                const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                bDiv.style.background = `radial-gradient(circle at 30% 30%, ${randomColor}, #00000040)`;

                // ربط أحداث النقر واللمس
                const handlePop = (e) => {
                    e.preventDefault(); // منع سلوك اللمس الافتراضي
                    popBalloon(letter, bDiv);
                };
                bDiv.onmousedown = handlePop;
                bDiv.ontouchstart = handlePop;

                board.appendChild(bDiv);
                
                // حفظ المرجع والعنصر في المصفوفة للتحكم في حركته
                balloons.push({ el: bDiv, l: letter, y: startY });
            });
        }

        // دالة التعامل مع فرقعة البالون
        function popBalloon(letter, element) {
            if(!balloonRunning) return;
            
            if(letter === currentBWord.m) {
                // إجابة صحيحة
                bScore += 10;
                document.getElementById('balloon-score').innerText = bScore;
                
                // إكمال الكلمة بصرياً
                document.getElementById('balloon-target-word').innerText = currentBWord.w.replace('_', currentBWord.m);
                
                // تأثير الفرقعة
                element.style.transform = 'scale(0)';
                element.style.opacity = '0';
                
                showToast('أحسنت! 🥳', 'success');
                
                // جلب الكلمة التالية بعد ثانية
                balloonRunning = false; // إيقاف مؤقت حتى تجهيز الكلمة التالية
                setTimeout(() => {
                    balloonRunning = true;
                    nextBalloonWord();
                }, 1200);

            } else {
                // إجابة خاطئة
                showToast('حرف خاطئ! حاول مجدداً', 'error');
                // اهتزاز وتغيير لون البالون الخاطئ
                element.style.transform = 'translate(-5px, 0)';
                setTimeout(() => element.style.transform = 'translate(5px, 0)', 50);
                setTimeout(() => element.style.transform = 'translate(0, 0)', 100);
            }
        }

        // حلقة اللعبة (Game Loop) لتحريك البالونات للأعلى
        function updateBalloons() {
            if(balloonRunning) {
                balloons.forEach(b => {
                    // سرعة الصعود تزداد قليلاً مع زيادة النقاط
                    b.y -= 1.2 + (bScore * 0.02); 
                    
                    // إذا خرج البالون من الأعلى، يعود للأسفل
                    if(b.y < -100) {
                        b.y = 450 + Math.random() * 100;
                    }
                    
                    b.el.style.top = b.y + 'px';
                });
            }
            // استمرار الحلقة
            animationFrame = requestAnimationFrame(updateBalloons);
        }

        // بدء اللعبة تلقائياً عند تحميل الصفحة
        window.onload = () => {
            initBalloons();
        };
    </script>
</body>
</html>
