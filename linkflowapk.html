  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منسق الروابط الذكي (LinkFlow)</title>
    
    <!-- مكتبة Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- إعدادات تطبيق الهاتف PWA -->
    <link rel="manifest" id="manifest-link">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script>
        // بناء ملف Manifest متوافق 100% مع شروط الهواتف الذكية لإجبار زر التثبيت على الظهور
        const manifestData = {
            "name": "LinkFlow",
            "short_name": "LinkFlow",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#38bdf8",
            "icons": [{
                "src": "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'%3E%3Cpath d='M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z'/%3E%3C/svg%3E",
                "sizes": "512x512",
                "type": "image/svg+xml",
                "purpose": "any maskable"
            }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);
        });
    </script>

    <style>
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: #0f172a; 
            color: #f8fafc;
            /* تثبيت الشاشة لمنع الاهتزاز في الموبايل */
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* كلاس التمرير السلس للموبايل (الحل السحري لمشكلة اللمس) */
        .scroll-touch {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            touch-action: pan-y;
        }
        
        /* تأثيرات زجاجية (Glassmorphism) */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 12px 40px rgba(56, 189, 248, 0.15);
        }

        /* خلفية متحركة لشاشة الدخول */
        .bg-animated {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #020617, #0c4a6e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* حركات الأنيميشن للعناصر */
        .fade-in-up { animation: fadeInUp 0.5s ease forwards; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loader { border-top-color: #38bdf8; animation: spinner 1s linear infinite; }
        @keyframes spinner { to { transform: rotate(360deg); } }

        .hide { display: none !important; }
        
        /* شريط تمرير أنيق */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #38bdf8; }
    </style>
</head>
<body class="fixed inset-0 flex flex-col selection:bg-sky-500 selection:text-white">

    <!-- 1. شاشة تسجيل الدخول المحدثة -->
    <div id="auth-screen" class="absolute inset-0 z-50 flex items-center justify-center bg-animated overflow-y-auto scroll-touch">
        
        <!-- فقاعات خلفية للزينة -->
        <div class="absolute top-20 left-20 w-32 h-32 bg-sky-500/20 rounded-full blur-3xl"></div>
        <div class="absolute bottom-20 right-20 w-40 h-40 bg-purple-500/20 rounded-full blur-3xl"></div>

        <div class="glass-panel p-8 md:p-10 rounded-3xl shadow-2xl w-full max-w-md text-center fade-in-up m-4 relative z-10 my-auto">
            <div class="w-24 h-24 bg-gradient-to-tr from-sky-400 to-indigo-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg shadow-sky-500/30">
                <span class="text-5xl text-white">🔗</span>
            </div>
            <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-white mb-2">LinkFlow</h1>
            <p class="text-slate-400 text-sm mb-6 font-bold">منسق الروابط الذكي ومحرر الكتب</p>

            <!-- زر التثبيت في شاشة الدخول (تم إزالة كلاس hide ليكون ظاهراً دائماً) -->
            <button type="button" class="install-pwa-btn w-full mb-6 bg-emerald-500/20 text-emerald-400 border border-emerald-500/50 hover:bg-emerald-500/40 px-4 py-3 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 shadow-lg">
                📱 تثبيت التطبيق على الهاتف
            </button>

            <div id="auth-error" class="hidden bg-red-500/20 border border-red-500/50 text-red-200 px-4 py-3 rounded-xl relative mb-6 text-sm font-bold text-left" dir="ltr"></div>

            <div class="space-y-4">
                <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full px-5 py-4 rounded-xl bg-slate-800/50 border border-slate-600 text-white placeholder-slate-400 focus:ring-2 focus:ring-sky-500 focus:border-transparent outline-none transition text-left" dir="ltr">
                <input type="password" id="password" placeholder="كلمة المرور (6 أحرف على الأقل)" class="w-full px-5 py-4 rounded-xl bg-slate-800/50 border border-slate-600 text-white placeholder-slate-400 focus:ring-2 focus:ring-sky-500 focus:border-transparent outline-none transition text-left" dir="ltr">
                
                <button type="button" onclick="handleAuth()" id="auth-btn" class="w-full bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-black py-4 px-4 rounded-xl shadow-lg shadow-sky-500/30 transition flex items-center justify-center gap-2 transform hover:-translate-y-1">
                    دخول / إنشاء حساب
                </button>
            </div>
        </div>
    </div>

    <!-- 2. واجهة التطبيق الرئيسية -->
    <div id="app-screen" class="hide h-full w-full flex flex-col md:flex-row bg-[#0b1120] overflow-hidden">
        
        <!-- القائمة الجانبية (المجموعات) -->
        <div class="w-full md:w-80 h-[35%] md:h-full glass-panel border-l border-slate-700/50 flex flex-col shadow-2xl z-20 shrink-0">
            <div class="p-5 border-b border-slate-700/50 flex justify-between items-center bg-slate-800/30 shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-sky-500/20 rounded-full flex items-center justify-center text-sky-400 font-bold border border-sky-500/30">👤</div>
                    <h2 class="font-black text-xl text-white">مجموعاتي</h2>
                </div>
                <button onclick="logout()" class="text-xs text-slate-400 hover:text-red-400 transition bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg font-bold">خروج</button>
            </div>
            
            <div class="p-4 flex gap-2 shrink-0">
                <input type="text" id="new-group-name" placeholder="مجموعة جديدة..." class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white outline-none focus:border-sky-500 transition text-sm">
                <button type="button" onclick="createGroup()" class="bg-sky-500 text-white px-4 py-3 rounded-xl font-bold hover:bg-sky-400 transition shadow-lg shadow-sky-500/20">+</button>
            </div>

            <div id="groups-list" class="flex-1 overflow-y-auto scroll-touch p-3 space-y-2">
                <!-- المجموعات ستضاف هنا -->
            </div>
        </div>

        <!-- منطقة الروابط -->
        <div class="flex-1 h-[65%] md:h-full bg-[#0b1120] flex flex-col relative z-10 overflow-hidden">
            
            <!-- الهيدر العلوي -->
            <div class="h-16 shrink-0 glass-panel border-b border-slate-700/50 flex items-center justify-between px-4 md:px-6 shadow-sm z-10">
                <h3 id="current-group-title" class="font-black text-base md:text-lg text-white flex items-center gap-2 truncate">
                    <span class="text-2xl">✨</span> اختر مجموعة
                </h3>
                
                <div class="flex items-center gap-2 md:gap-3 shrink-0">
                    <!-- زر تثبيت التطبيق PWA (تم إزالة كلاس hide ليكون ظاهراً دائماً) -->
                    <button class="install-pwa-btn bg-emerald-500/20 text-emerald-400 border border-emerald-500/50 hover:bg-emerald-500/40 px-2 md:px-3 py-2 rounded-lg font-bold text-xs transition flex items-center gap-1 md:gap-2 shadow-lg shadow-emerald-500/10">
                        📱 <span class="hidden sm:inline">تثبيت</span>
                    </button>
                    
                    <button type="button" onclick="toggleBookEditor()" class="bg-indigo-500/20 text-indigo-300 border border-indigo-500/50 hover:bg-indigo-500/40 px-3 md:px-4 py-2 rounded-lg font-bold text-xs md:text-sm transition flex items-center gap-2">
                        📖 <span class="hidden sm:inline">محرر الكتب</span>
                    </button>
                </div>
            </div>

            <!-- عرض الروابط (ستايل الكروت) -->
            <div id="links-container" class="flex-1 overflow-y-auto scroll-touch p-4 md:p-6 pb-24 md:pb-32 space-y-4">
                <div class="w-full h-full flex items-center justify-center flex-col gap-4 opacity-50">
                    <div class="w-24 h-24 bg-slate-800 rounded-full flex items-center justify-center text-4xl">📭</div>
                    <p class="text-slate-400 font-bold">لا توجد روابط هنا. الصق رابطاً في الأسفل!</p>
                </div>
            </div>

            <!-- صندوق إضافة رابط جديد (ثابت في الأسفل) -->
            <div id="add-link-box" class="hide absolute bottom-0 left-0 w-full p-4 glass-panel border-t border-slate-700/50 z-20">
                <div class="flex gap-2 max-w-4xl mx-auto bg-slate-900 p-2 rounded-2xl border border-slate-700 shadow-2xl">
                    <input type="url" id="new-link-url" placeholder="الصق الرابط هنا (🔗 Share)" class="flex-1 px-4 py-3 rounded-xl bg-transparent border-none text-white focus:ring-0 outline-none text-left" dir="ltr">
                    <button type="button" onclick="addLink()" id="add-link-btn" class="bg-sky-500 text-white px-4 md:px-8 py-3 rounded-xl font-bold hover:bg-sky-400 transition shadow-lg shadow-sky-500/20 flex items-center justify-center min-w-[80px] md:min-w-[120px]">
                        حفظ
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. نافذة محرر الكتب التفاعلي -->
    <div id="book-editor" class="hide fixed inset-0 bg-[#0f172a] z-50 flex flex-col overflow-hidden">
        <div class="h-16 shrink-0 bg-gradient-to-r from-indigo-900 to-slate-900 flex items-center justify-between px-6 shadow-xl border-b border-indigo-500/30 text-white z-10">
            <h2 class="font-black text-lg md:text-xl flex items-center gap-2">📖 محرر كتب الروابط</h2>
            <div class="flex gap-3">
                <button type="button" onclick="exportBook()" class="bg-emerald-500/20 hover:bg-emerald-500/40 text-emerald-400 border border-emerald-500/50 px-3 md:px-4 py-2 rounded-lg text-xs md:text-sm font-bold transition">تصدير PDF</button>
                <button type="button" onclick="toggleBookEditor()" class="bg-red-500/20 hover:bg-red-500/40 text-red-400 border border-red-500/50 px-3 md:px-4 py-2 rounded-lg text-xs md:text-sm font-bold transition">إغلاق X</button>
            </div>
        </div>
        
        <div class="flex-1 overflow-hidden bg-slate-950 p-4 md:p-8 flex justify-center">
            <div class="w-full max-w-4xl overflow-y-auto scroll-touch" id="book-pages">
                <!-- صفحة الكتاب (تصميم أبيض للطباعة) -->
                <div class="bg-white p-6 md:p-12 min-h-[800px] shadow-2xl rounded-sm w-full">
                    <h1 contenteditable="true" class="text-3xl md:text-5xl font-black text-center mb-6 text-slate-800 outline-none border-b-2 border-transparent focus:border-indigo-200 pb-4">عنوان الكتاب / الكورس...</h1>
                    <p contenteditable="true" class="text-slate-600 outline-none min-h-[50px] mb-10 leading-relaxed text-base md:text-lg">اضغط هنا لكتابة مقدمة أو وصف لمحتوى هذا المرجع...</p>
                    
                    <!-- الروابط ستنزل هنا -->
                    <div id="book-content" class="space-y-8"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. PWA & Service Worker (نظام التثبيت الذكي الجديد)
        // ==========================================
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => self.clients.claim());
                self.addEventListener('fetch', (e) => {
                    e.respondWith(fetch(e.request).catch(() => new Response('Offline')));
                });
            `;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(console.error);
        }

        let deferredPrompt;
        const installBtns = document.querySelectorAll('.install-pwa-btn');

        // التقاط حدث التثبيت إذا كان المتصفح يدعمه
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        // التحديث الجديد: برمجة الزر لتحميل ملف الـ APK الحقيقي
        installBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // ضعي هنا رابط ملف الـ APK الخاص بك الذي قمتِ بإنشائه ورفعه
                // إذا كان مرفوعاً بجوار ملف الـ HTML على جيت هب، اكتبيه هكذا: './LinkFlow.apk'
                const apkDownloadUrl = "https://paintinglikeair-alt.github.io/kjgxeAjlxsaesamlkiligcccjkjfdjjxdj/app-release.apk"; // استبدلي هذا بالرابط الحقيقي
                
                // تنبيه المستخدم
                alert("⏳ جاري تنزيل التطبيق (APK) الآن...\n\nبعد انتهاء التنزيل، افتحي الملف من مجلد التنزيلات بهاتفك واضغطي 'تثبيت' (Install).");
                
                // توجيه المتصفح لتحميل الملف
                const a = document.createElement('a');
                a.href = apkDownloadUrl;
                a.download = "LinkFlow_App.apk"; // الاسم الذي سينزل به الملف
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });
        });

        // ==========================================
        // 2. إعدادات Supabase 
        // ==========================================
        const SUPABASE_URL = 'https://afognmfizulueoskbwka.supabase.co';
         // ضعي المفتاح الطويل الذي يبدأ بـ eyJ هنا بين علامتي التنصيص:
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmb2dubWZpenVsdWVvc2tid2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTA5MjQsImV4cCI6MjEwNDQyNjkyNH0.eqbzR0jhNn80Suk7yMuWWvbKo-08I7UCYBJPXYSj70o';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentGroupId = null;

        // ==========================================
        // 3. نظام المصادقة الذكي المحدث
        // ==========================================
        window.onload = async function() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                showApp();
                loadGroups();
            }
        };

        async function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('auth-btn');
            const errorBox = document.getElementById('auth-error');
            
            if (!email || password.length < 6) {
                errorBox.innerText = "الرجاء إدخال إيميل صحيح وكلمة مرور 6 أحرف على الأقل.";
                errorBox.classList.remove('hidden');
                return;
            }

            errorBox.classList.add('hidden');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="w-6 h-6 border-4 border-white/30 border-t-white border-solid rounded-full loader"></div>';
            btn.disabled = true;

            try {
                let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                
                if (error) {
                    if (error.message.includes('Invalid login credentials')) {
                        const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({ email, password });
                        
                        if (signUpError) {
                            if(signUpError.message.includes('already registered')) {
                                throw new Error("هذا الإيميل مسجل بالفعل، لكن كلمة المرور التي أدخلتها خاطئة!");
                            }
                            throw signUpError;
                        }
                        data = signUpData; 
                    } else {
                        throw error; 
                    }
                }

                if (data && data.session) {
                    currentUser = data.session.user;
                    showApp();
                    loadGroups();
                } else {
                    throw new Error("حدث خطأ غير معروف، تأكدي من إيقاف (Email Confirmation) في إعدادات Supabase.");
                }

            } catch (err) {
                errorBox.innerText = "❌ " + err.message;
                errorBox.classList.remove('hidden');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        function showApp() {
            document.getElementById('auth-screen').classList.add('hide');
            document.getElementById('app-screen').classList.remove('hide');
        }

        // ==========================================
        // 4. إدارة المجموعات
        // ==========================================
        async function loadGroups() {
            const list = document.getElementById('groups-list');
            try {
                const { data: groups, error } = await supabaseClient.from('groups').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                if (groups.length === 0) {
                    list.innerHTML = '<div class="text-center text-slate-500 text-sm mt-10 font-bold p-4 bg-slate-800/50 rounded-xl">لا توجد مجموعات بعد. أنشئ مجموعة لحفظ روابطك!</div>';
                    return;
                }

                list.innerHTML = '';
                groups.forEach(group => {
                    const div = document.createElement('div');
                    div.className = 'group-item p-4 mb-2 rounded-xl cursor-pointer font-bold text-slate-300 bg-slate-800/40 border border-slate-700/50 hover:bg-sky-500/10 hover:border-sky-500/30 hover:text-sky-400 transition flex items-center gap-3';
                    div.innerHTML = `<span class="text-xl">📁</span> <span class="truncate flex-1">${group.name}</span>`;
                    div.onclick = (e) => {
                        document.querySelectorAll('.group-item').forEach(el => el.classList.remove('bg-sky-500/20', 'border-sky-500/50', 'text-sky-400'));
                        e.currentTarget.classList.add('bg-sky-500/20', 'border-sky-500/50', 'text-sky-400');
                        selectGroup(group.id, group.name);
                    };
                    list.appendChild(div);
                });
            } catch (err) {
                list.innerHTML = `<div class="text-red-400 text-sm bg-red-500/10 p-3 rounded-lg">خطأ: ${err.message}</div>`;
            }
        }

        async function createGroup() {
            const nameInput = document.getElementById('new-group-name');
            const name = nameInput.value.trim();
            if (!name) return;

            try {
                const { error } = await supabaseClient.from('groups').insert([{ name: name, user_id: currentUser.id }]);
                if (error) throw error;
                nameInput.value = '';
                loadGroups();
            } catch (err) { alert("خطأ: " + err.message); }
        }

        function selectGroup(id, name) {
            currentGroupId = id;
            document.getElementById('current-group-title').innerHTML = `<span class="text-sky-400 text-xl md:text-2xl">📁</span> <span class="truncate">${name}</span>`;
            document.getElementById('add-link-box').classList.remove('hide');
            loadLinks(id);
        }

        // ==========================================
        // 5. إدارة الروابط والـ API
        // ==========================================
        async function loadLinks(groupId) {
            const container = document.getElementById('links-container');
            container.innerHTML = '<div class="w-full h-full flex items-center justify-center"><div class="w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full loader"></div></div>';

            try {
                const { data: links, error } = await supabaseClient.from('links').select('*').eq('group_id', groupId).order('created_at', { ascending: true });
                if (error) throw error;

                if (links.length === 0) {
                    container.innerHTML = '<div class="w-full h-full flex items-center justify-center flex-col gap-4 opacity-50"><div class="w-24 h-24 bg-slate-800 rounded-full flex items-center justify-center text-4xl">📭</div><p class="text-slate-400 font-bold">هذه المجموعة فارغة.</p></div>';
                    return;
                }

                container.innerHTML = '';
                links.forEach(link => {
                    const div = document.createElement('div');
                    div.className = 'glass-card p-4 rounded-2xl flex flex-col sm:flex-row gap-4 fade-in-up';
                    div.innerHTML = `
                        <div class="w-full sm:w-40 h-32 sm:h-28 bg-slate-800 rounded-xl overflow-hidden shrink-0 flex items-center justify-center border border-slate-700">
                            ${link.image ? `<img src="${link.image}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x300/1e293b/38bdf8?text=🔗'">` : `<span class="text-3xl text-slate-500">🔗</span>`}
                        </div>
                        <div class="flex-1 flex flex-col justify-center min-w-0">
                            <a href="${link.url}" target="_blank" class="font-black text-sky-400 hover:text-sky-300 hover:underline mb-1 text-lg sm:text-xl line-clamp-2 sm:line-clamp-1 break-words" dir="auto">${link.title || link.url}</a>
                            <p class="text-sm text-slate-400 line-clamp-2 mb-3 break-words" dir="auto">${link.description || 'لا يوجد وصف متاح.'}</p>
                            <a href="${link.url}" target="_blank" class="text-xs text-slate-500 truncate bg-slate-900/50 px-2 py-1 rounded inline-block max-w-fit border border-slate-800" dir="ltr">${link.url}</a>
                        </div>
                        <div class="flex sm:flex-col items-center justify-center gap-2 border-t sm:border-t-0 border-slate-700 pt-3 sm:pt-0 shrink-0">
                            <button onclick='addToBook(${JSON.stringify(link).replace(/'/g, "&#39;")})' class="w-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 hover:bg-indigo-500/40 px-3 py-2 rounded-lg text-xs font-bold whitespace-nowrap transition">➕ للكتاب</button>
                            <button onclick="deleteLink('${link.id}')" class="w-full text-red-400 border border-transparent hover:border-red-500/30 hover:bg-red-500/20 px-3 py-2 rounded-lg text-xs font-bold transition">حذف</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            } catch (err) {
                container.innerHTML = `<div class="text-red-400 p-4 bg-red-500/10 rounded-xl">خطأ: ${err.message}</div>`;
            }
        }

        async function addLink() {
            if (!currentGroupId) return;
            const input = document.getElementById('new-link-url');
            const url = input.value.trim();
            const btn = document.getElementById('add-link-btn');

            if (!url || !url.startsWith('http')) {
                alert("الرجاء إدخال رابط صحيح يبدأ بـ http أو https");
                return;
            }

            const originalBtnHtml = btn.innerHTML;
            btn.innerHTML = '<div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full loader"></div>';
            btn.disabled = true;

            try {
                let title = url;
                let description = '';
                let image = '';
                let domain = new URL(url).hostname;
                let fallbackImage = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;

                try {
                    const previewRes = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
                    const previewData = await previewRes.json();
                    
                    if (previewData.status === 'success') {
                        title = previewData.data.title || title;
                        description = previewData.data.description || '';
                        image = previewData.data.image ? previewData.data.image.url : fallbackImage;
                    } else {
                        image = fallbackImage;
                    }
                } catch(e) {
                    image = fallbackImage;
                }

                const { error } = await supabaseClient.from('links').insert([{ 
                    group_id: currentGroupId, 
                    user_id: currentUser.id,
                    url: url,
                    title: title,
                    description: description,
                    image: image
                }]);
                
                if (error) throw error;
                
                input.value = '';
                loadLinks(currentGroupId);
            } catch (err) {
                alert("تعذر حفظ الرابط: " + err.message);
            } finally {
                btn.innerHTML = originalBtnHtml;
                btn.disabled = false;
            }
        }

        async function deleteLink(linkId) {
            if(!confirm("هل أنت متأكد من حذف هذا الرابط؟")) return;
            await supabaseClient.from('links').delete().eq('id', linkId);
            loadLinks(currentGroupId);
        }

        // ==========================================
        // 6. محرر الكتب
        // ==========================================
        function toggleBookEditor() {
            const editor = document.getElementById('book-editor');
            editor.classList.toggle('hide');
        }

        function addToBook(linkData) {
            const content = document.getElementById('book-content');
            const div = document.createElement('div');
            div.className = 'p-4 md:p-6 border border-slate-200 rounded-2xl relative group bg-white shadow-sm hover:shadow-md transition mb-6';
            
            let html = `<h3 contenteditable="true" class="text-xl md:text-2xl font-black text-sky-600 mb-3 outline-none focus:bg-sky-50 p-1 rounded" dir="auto">${linkData.title}</h3>`;
            
            if (linkData.image) {
                html += `<div class="w-full bg-slate-100 rounded-xl overflow-hidden mb-4"><img src="${linkData.image}" class="w-full max-h-72 object-cover" onerror="this.style.display='none'"></div>`;
            }
            
            html += `<p contenteditable="true" class="text-slate-600 outline-none leading-relaxed min-h-[40px] mb-3 focus:bg-slate-50 p-2 rounded text-base md:text-lg" dir="auto">${linkData.description}</p>`;
            html += `<a href="${linkData.url}" target="_blank" class="text-xs md:text-sm text-indigo-500 hover:underline block mb-6 font-bold truncate" contenteditable="false" dir="ltr">${linkData.url}</a>`;
            html += `<div contenteditable="true" class="bg-amber-50 border-r-4 border-amber-400 p-3 md:p-4 text-sm md:text-base text-amber-900 outline-none focus:bg-amber-100 rounded-l-lg font-bold" dir="auto">✏️ مساحة للملاحظات: اضغط هنا لكتابة كيف ستستفيد من هذا الرابط...</div>`;
            
            html += `<button onclick="this.parentElement.remove()" class="absolute top-2 left-2 md:top-4 md:left-4 bg-red-100 text-red-500 hover:bg-red-200 px-2 py-1 md:px-3 md:py-1.5 rounded-lg text-xs md:text-sm font-bold opacity-100 md:opacity-0 md:group-hover:opacity-100 transition no-print shadow-sm" contenteditable="false">حذف</button>`;

            div.innerHTML = html;
            content.appendChild(div);
            
            const btn = document.querySelector('button[onclick="toggleBookEditor()"]');
            const oldHtml = btn.innerHTML;
            btn.classList.replace('text-indigo-300', 'text-emerald-400');
            btn.classList.replace('border-indigo-500/50', 'border-emerald-500');
            btn.innerHTML = '✅ <span class="hidden sm:inline">تم الإضافة</span>';
            setTimeout(() => {
                btn.classList.replace('text-emerald-400', 'text-indigo-300');
                btn.classList.replace('border-emerald-500', 'border-indigo-500/50');
                btn.innerHTML = oldHtml;
            }, 2000);
        }

        function exportBook() {
            const style = document.createElement('style');
            style.innerHTML = `@media print { 
                .no-print { display: none !important; } 
                body { background: white; overflow: visible !important; }
                body * { visibility: hidden; } 
                #book-pages, #book-pages * { visibility: visible; } 
                #book-pages { position: absolute; left: 0; top: 0; width: 100%; height: auto; overflow: visible !important; background: white; margin: 0; padding: 0; } 
                .bg-white { box-shadow: none !important; padding: 0 !important; }
            }`;
            document.head.appendChild(style);
            window.print();
            setTimeout(() => document.head.removeChild(style), 1000);
        }
    </script>
