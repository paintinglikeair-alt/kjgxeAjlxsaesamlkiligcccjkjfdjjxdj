<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Presentation Studio - Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at center, #1a1c23 0%, #050608 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ecf0f1;
            perspective: 2000px; 
        }

        .ambient-light {
            position: absolute; top: -20%; left: 50%; transform: translateX(-50%);
            width: 100vw; height: 100vh;
            background: radial-gradient(ellipse at top, rgba(255, 255, 255, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none; z-index: 0; transition: background 1s;
        }

        .scene-container {
            position: absolute; width: 100vw; height: 100vh;
            transform-style: preserve-3d; z-index: 2;
            transition: transform 0.5s ease-out;
        }

        .theme-container {
            position: absolute; width: 100%; height: 100%;
            transform-style: preserve-3d; display: none; opacity: 0; transition: opacity 0.5s;
        }
        .theme-container.active { display: block; opacity: 1; }

        /* ========================================= */
        /* 1. نموذج الاستاند (Easel) */
        /* ========================================= */
        .easel-group {
            position: absolute; top: 50%;
            left: 25vw; 
            width: 600px; height: 800px; margin-top: -350px; margin-left: -300px;
            transform-style: preserve-3d;
            transform: translateZ(-50px) rotateY(15deg) scale(0.9);
            transition: transform 1.5s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        
        .wood {
            background: linear-gradient(90deg, #2c1e16, #4a332a, #2c1e16);
            position: absolute;
            box-shadow: inset -2px 0 5px rgba(0,0,0,0.5), inset 2px 0 5px rgba(255,255,255,0.05);
        }
        .leg-center { width: 40px; height: 100%; left: 280px; z-index: 1;}
        .leg-left   { width: 35px; height: 95%; left: 100px; transform: rotate(15deg); transform-origin: top; z-index: 0;}
        .leg-right  { width: 35px; height: 95%; right: 100px; transform: rotate(-15deg); transform-origin: top; z-index: 0;}
        .shelf { width: 700px; height: 35px; bottom: 200px; left: -50px; z-index: 2; transform: translateZ(10px); border-radius: 4px; box-shadow: 0 15px 20px rgba(0,0,0,0.8); }
        
        .easel-canvas {
            position: absolute; bottom: 235px;
            width: 500px; height: 400px;
            left: 50%; transform: translateX(-50%) translateZ(15px) rotateX(2deg);
            background: #f4ecd8;
            transform-style: preserve-3d;
            transition: width 0.8s, height 0.8s;
            box-shadow: -5px 5px 0 #a39574, -15px 20px 30px rgba(0,0,0,0.8);
            padding: 15px; border-radius: 5px;
        }
        .easel-media { width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 0.5s; background: rgba(0,0,0,0.05); }

        .easel-text-layer {
            position: absolute; top: 0; right: 5vw; width: 45vw; height: 100%;
            pointer-events: none; display: flex; align-items: center;
        }
        .easel-text-box {
            padding: 40px; text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
            transform: translateX(-100px); opacity: 0; transition: all 1s;
        }
        .easel-text-box.show { transform: translateX(0); opacity: 1; }

        /* ========================================= */
        /* 2. نموذج الكتاب (True 3D Book) */
        /* ========================================= */
        .book-scene {
            position: absolute; top: 50%; left: 50%;
            width: 400px; height: 500px;
            margin-top: -250px; margin-left: -200px;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
        }
        
        .book-scene.closed-front { transform: translateZ(100px) rotateX(15deg) rotateY(15deg); }
        .book-scene.open-inside { transform: translateZ(250px) translateX(-200px) rotateX(10deg) rotateY(0deg); }
        .book-scene.closed-back { transform: translateZ(100px) translateX(-400px) rotateX(15deg) rotateY(-15deg); }

        .book-static-part {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform-style: preserve-3d;
            transform-origin: right center;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            z-index: 5;
        }
        .book-static-part.close-to-right { transform: rotateY(180deg) translateZ(-5px); z-index: 15; }

        .book-front-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform-style: preserve-3d;
            transform-origin: right center;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            z-index: 10;
        }
        .book-front-wrapper.open { transform: rotateY(180deg); }

        .book-cover-front-face, .book-cover-back-face, .book-page-left-face, .book-page-right-face {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            backface-visibility: hidden; padding: 30px;
        }

        .book-cover-front-face, .book-cover-back-face {
            background: #2c3e50; border: 4px solid #d4af37;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            color: white; box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
        }
        .book-cover-front-face { border-radius: 15px 0 0 15px; transform: translateZ(2px); }
        .book-cover-back-face { border-radius: 0 15px 15px 0; transform: rotateY(180deg) translateZ(2px); }

        .book-page-left-face, .book-page-right-face { background: #fdfbf7; color: #2c3e50; box-shadow: inset 0 0 20px rgba(0,0,0,0.1); }
        .book-page-left-face { border-radius: 15px 0 0 15px; transform: translateZ(1px); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .book-page-right-face { border-radius: 0 15px 15px 0; transform: rotateY(180deg) translateZ(1px); }

        .book-page-flip {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fdfbf7; transform-origin: right center;
            z-index: 8; border-radius: 15px 0 0 15px;
            transform: rotateY(0deg); opacity: 0; pointer-events: none;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
        }
        .book-page-flip.animate { animation: flipPage 1s ease-in-out forwards; opacity: 1; }
        @keyframes flipPage { 
            0% { transform: rotateY(0deg); opacity: 1; z-index: 15;} 
            50% { background: #e8e3d8;} 
            100% { transform: rotateY(180deg); opacity: 0; z-index: 5;} 
        }

        .book-media { width: 100%; height: 100%; object-fit: contain; border-radius: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); background: rgba(0,0,0,0.03); }
        .cover-media { width: 90%; height: 45%; object-fit: contain; border-radius: 5px; margin-bottom: 20px; border: 2px solid #d4af37; background: rgba(0,0,0,0.2); }
        
        .page-text-content { opacity: 0; transform: translateY(10px); transition: opacity 0.5s, transform 0.5s; padding: 10px;}
        .page-text-content.show { opacity: 1; transform: translateY(0); transition-delay: 0.8s; }
        .book-heading { font-family: 'Amiri', serif; font-size: 2rem; color: #c0392b; margin-bottom: 15px; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px;}
        .cover-heading { font-family: 'Amiri', serif; font-size: 2rem; color: #d4af37; text-shadow: 2px 2px 5px #000;}
        .book-para { font-size: 1.2rem; line-height: 1.8; font-weight: 600;}
        .cover-para { color: #eee; font-size: 1.1rem; margin-top: 10px;}

        /* ========================================= */
        /* 3. نموذج الهولوجرام */
        /* ========================================= */
        .holo-scene {
            position: absolute; top: 50%; left: 50%;
            width: 900px; height: 500px; margin-top: -250px; margin-left: -450px; transform-style: preserve-3d;
        }
        .holo-base {
            position: absolute; bottom: -80px; left: 50%; transform: translateX(-50%) rotateX(75deg);
            width: 400px; height: 400px; border-radius: 50%; border: 2px dashed #00d2d3;
            box-shadow: 0 0 50px rgba(0, 210, 211, 0.5), inset 0 0 30px rgba(0, 210, 211, 0.3);
            animation: spinBase 10s linear infinite;
        }
        @keyframes spinBase { 100% { transform: translateX(-50%) rotateX(75deg) rotateZ(360deg); } }

        .holo-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 20, 30, 0.4); border: 1px solid rgba(0, 210, 211, 0.3);
            box-shadow: 0 0 30px rgba(0, 210, 211, 0.2);
            backdrop-filter: blur(5px); transform: translateZ(50px);
            animation: floatScreen 4s ease-in-out infinite;
            display: flex; gap: 20px; padding: 20px;
        }
        @keyframes floatScreen { 0%, 100% { transform: translateZ(50px) translateY(0); } 50% { transform: translateZ(50px) translateY(-20px); } }

        .holo-screen::after { 
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 10px;
            background: rgba(0, 210, 211, 0.5); box-shadow: 0 0 20px #00d2d3;
            animation: scanline 3s linear infinite; opacity: 0.5; pointer-events: none;
        }

        .holo-img-container { width: 50%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .holo-media { max-width: 100%; max-height: 100%; object-fit: contain; filter: sepia(1) hue-rotate(180deg) saturate(2); mix-blend-mode: screen; opacity: 0.9; border-radius: 10px;}
        
        .holo-text-container { width: 50%; height: 100%; padding: 20px; display: flex; flex-direction: column; justify-content: center; }
        .holo-title { color: #fff; text-shadow: 0 0 10px #00d2d3; font-size: 2.2rem; margin-bottom: 15px; font-weight: 900; }
        .holo-para { color: #81ecec; font-size: 1.2rem; line-height: 1.6; }

        /* ========================================= */
        /* 4. نموذج قاعة المسرح (Cinema Stage)       */
        /* ========================================= */
        .cinema-scene {
            position: absolute; top: 50%; left: 50%;
            width: 1000px; height: 600px; margin-top: -300px; margin-left: -500px;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .cinema-screen-container {
            position: absolute; top: 20px; left: 10vw; width: 800px; height: 450px;
            background: #000; border: 8px solid #111; border-radius: 8px;
            box-shadow: 0 0 80px rgba(255,255,255,0.1), 0 20px 50px rgba(0,0,0,0.8);
            transform: translateZ(-100px);
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; z-index: 5;
        }
        
        /* تأثير ضوء جهاز العرض (البروجيكتور) */
        .cinema-screen-container::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.4) 100%);
            pointer-events: none; z-index: 10;
        }

        .cinema-media { width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 0.8s; }

        /* ستائر المسرح */
        .curtain {
            position: absolute; top: -50px; width: 510px; height: 700px;
            background: repeating-linear-gradient(to right, #800000, #4a0000 20px, #800000 40px);
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            z-index: 15; transform-origin: top;
            transition: transform 1.5s ease-in-out, width 1.5s ease-in-out;
        }
        .curtain-left { left: -5px; border-radius: 0 0 30% 0; }
        .curtain-right { right: -5px; border-radius: 0 0 0 30%; }

        /* حالات الستائر (مغلقة ومفتوحة) */
        .cinema-scene.closed .curtain-left { transform: translateZ(50px) translateX(0); width: 510px; }
        .cinema-scene.closed .curtain-right { transform: translateZ(50px) translateX(0); width: 510px; }
        .cinema-scene.open .curtain-left { transform: translateZ(50px) translateX(-350px); width: 150px; }
        .cinema-scene.open .curtain-right { transform: translateZ(50px) translateX(350px); width: 150px; }

        .cinema-subtitles {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%) translateZ(80px);
            width: 80%; text-align: center; color: #fff; text-shadow: 2px 2px 4px #000, 0 0 10px rgba(255,255,255,0.3);
            z-index: 20; display: flex; flex-direction: column; align-items: center;
        }
        
        .cinema-title { font-family: 'Amiri', serif; font-size: 2.5rem; color: #f1c40f; margin-bottom: 10px; }
        .cinema-para { font-size: 1.3rem; font-weight: bold; line-height: 1.6; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 10px; opacity: 0; transform: translateY(20px); transition: 0.5s; }
        .cinema-para.show { opacity: 1; transform: translateY(0); }

        /* ========================================= */
        /* 5. نموذج المخطوطة الأثرية (Ancient Scroll)*/
        /* ========================================= */
        .scroll-scene {
            position: absolute; top: 50%; left: 50%;
            width: 600px; height: 800px; margin-top: -400px; margin-left: -300px;
            transform-style: preserve-3d;
            transform: rotateX(5deg) translateZ(50px);
        }

        .scroll-roller {
            position: absolute; left: -30px; width: 660px; height: 40px;
            background: linear-gradient(to bottom, #5c3a21, #2e1d10, #5c3a21);
            border-radius: 20px; z-index: 10;
            box-shadow: 0 10px 15px rgba(0,0,0,0.6), inset 0 0 10px rgba(0,0,0,0.8);
            transition: transform 1s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        .roller-thick { transform: scaleY(1.8) scaleX(1.02); }
        .roller-thin { transform: scaleY(0.7) scaleX(0.95); }

        .scroll-roller::after, .scroll-roller::before {
            content: ''; position: absolute; top: 5px; width: 30px; height: 30px; border-radius: 50%;
            background: radial-gradient(circle, #f1c40f, #d35400); box-shadow: inset 0 0 5px #000;
        }
        .scroll-roller::before { left: -10px; } .scroll-roller::after { right: -10px; }
        
        .scroll-top-roller { top: 30px; }
        .scroll-bottom-roller { bottom: 30px; }

        .scroll-paper {
            position: absolute; top: 50px; left: 0; width: 100%; height: 700px;
            background: #e8d8b0;
            background-image: radial-gradient(#d3b887 1px, transparent 1px); background-size: 20px 20px; /* Texture */
            box-shadow: inset 0 0 50px rgba(139,69,19,0.4), 0 5px 20px rgba(0,0,0,0.5);
            overflow: hidden; z-index: 5;
        }

        .scroll-content-wrapper {
            padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 20px;
            transition: transform 1s cubic-bezier(0.25, 0.1, 0.25, 1), opacity 0.5s;
            transform: translateY(0); opacity: 1;
        }
        .scroll-content-wrapper.hide-top { transform: translateY(-100%); opacity: 0; }
        .scroll-content-wrapper.hide-bottom { transform: translateY(100%); opacity: 0; }
        .scroll-content-wrapper.show { transform: translateY(0); opacity: 1; }
        .scroll-content-wrapper.no-transition { transition: none !important; }

        .scroll-title { font-family: 'Amiri', serif; font-size: 2.8rem; color: #5e3a12; text-shadow: 1px 1px 0 #fff; text-align: center;}
        .scroll-para { font-size: 1.3rem; color: #3e2723; font-weight: bold; text-align: center; line-height: 1.8;}
        
        .scroll-media-box { width: 100%; height: 350px; border: 4px solid #8b4513; border-radius: 4px; padding: 5px; background: rgba(0,0,0,0.05); }
        .scroll-media { width: 100%; height: 100%; object-fit: contain; filter: sepia(0.4); }

        /* ========================================= */
        /* واجهة المستخدم وأزرار التحكم */
        /* ========================================= */
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100;}
        .ui-overlay > * { pointer-events: auto; }

        .top-bar { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; }
        
        .theme-selector { 
            background: rgba(15, 20, 25, 0.85); 
            backdrop-filter: blur(12px); 
            padding: 6px; 
            border-radius: 16px; 
            border: 1px solid rgba(255,255,255,0.15); 
            display: flex; gap: 6px; flex-wrap: wrap; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .theme-selector:hover {
            border-color: rgba(0, 210, 211, 0.4);
            box-shadow: 0 10px 30px rgba(0, 210, 211, 0.15);
        }
        .theme-btn { 
            background: transparent; color: #aaa; border: none; 
            padding: 8px 14px; border-radius: 10px; cursor: pointer; 
            font-family: 'Cairo'; font-weight: bold; transition: 0.3s; 
            font-size: 0.85rem; display: flex; align-items: center; gap: 6px;
        }
        .theme-btn.active { 
            background: linear-gradient(135deg, rgba(0, 210, 211, 0.3), rgba(0, 184, 148, 0.3)); 
            color: #00d2d3; 
            box-shadow: 0 0 15px rgba(0, 210, 211, 0.3);
            border: 1px solid rgba(0, 210, 211, 0.3);
        }
        .theme-btn:hover:not(.active) { color: #fff; background: rgba(255,255,255,0.1); }

        .action-btns button {
            background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 15px; font-family: 'Cairo'; font-weight: bold; cursor: pointer; border-radius: 8px; backdrop-filter: blur(5px); transition: 0.3s; margin-left: 10px;
        }
        .action-btns button:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }

        .bottom-bar {
            position: absolute; bottom: 30px; right: 30px; left: auto; transform: none;
            display: flex; align-items: center; gap: 15px;
            background: rgba(15, 20, 25, 0.85); padding: 8px 16px; border-radius: 20px; 
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15);
            z-index: 100; box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }
        .nav-btn { 
            background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.15); 
            font-size: 0.9rem; cursor: pointer; transition: 0.3s; padding: 6px 12px; border-radius: 10px; 
            font-family: 'Cairo'; font-weight: bold;
        }
        .nav-btn:hover { background: rgba(0, 210, 211, 0.2); border-color: #00d2d3; color: #00d2d3; }
        .slide-counter { font-size: 0.95rem; font-weight: bold; font-family: sans-serif; letter-spacing: 1px; color: #ccc;}

        /* لوحة التعديل الجانبية (في اليسار) */
        .editor-panel {
            position: absolute; left: -420px; top: 80px; width: 380px; height: calc(100vh - 160px);
            background: rgba(15, 20, 25, 0.95); backdrop-filter: blur(15px); border: 1px solid rgba(0, 210, 211, 0.3);
            border-radius: 15px; padding: 20px; transition: left 0.4s ease; display: flex; flex-direction: column; gap: 15px; z-index: 150;
        }
        .editor-panel.open { left: 20px; }
        .editor-panel h3 { color: #00d2d3; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 10px;}
        .editor-panel label { color: #ccc; font-size: 0.9rem; margin-bottom: 5px; display: block;}
        .editor-panel input[type="text"], .editor-panel input[type="file"], .editor-panel textarea {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.5); color: #fff; font-family: 'Cairo'; margin-bottom: 10px; resize: none;
        }
        
        /* تكبير مساحة تعديل النص بشكل ديناميكي */
        .editor-panel textarea { flex-grow: 1; min-height: 150px; }
        .editor-panel input:focus, .editor-panel textarea:focus { outline: none; border-color: #00d2d3; }
        
        .editor-btns { display: flex; gap: 10px; margin-top: auto;}
        .editor-btns button { flex: 1; padding: 10px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer;}
        .btn-save { background: #00b894; color: white;} .btn-save:hover { background: #00d2d3;}
        .btn-add { background: #0984e3; color: white;} .btn-add:hover { background: #74b9ff;}
        .btn-del { background: #d63031; color: white;} .btn-del:hover { background: #ff7675;}
        
        .toggle-editor-btn { background: #e1b12c !important; color: #2d3436 !important;}

        /* زر التصدير العائم (FAB) */
        .fab-container { position: absolute; bottom: 30px; left: 30px; z-index: 1000; display: flex; flex-direction: column-reverse; align-items: center; gap: 15px; pointer-events: none;}
        .fab-container > * { pointer-events: auto; }
        .fab-btn { width: 55px; height: 55px; border-radius: 50%; background: #00b894; color: #fff; border: none; font-size: 1.5rem; cursor: pointer; box-shadow: 0 5px 20px rgba(0,184,148,0.5); transition: 0.3s; display: flex; align-items: center; justify-content: center;}
        .fab-btn:hover { transform: scale(1.1); background: #00d2d3;}
        .fab-menu { display: flex; flex-direction: column; gap: 10px; opacity: 0; pointer-events: none; transform: translateY(20px); transition: 0.3s; align-items: flex-start;}
        .fab-container:hover .fab-menu { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .fab-item { background: rgba(30, 39, 46, 0.9); backdrop-filter: blur(5px); color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 10px 18px; border-radius: 25px; font-family: 'Cairo'; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 10px; transition: 0.3s; font-weight: bold; font-size: 0.9rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
        .fab-item:hover { background: #00b894; color: #fff; transform: translateX(5px);}
        
        /* إعدادات الطباعة للـ PDF */
        @media print {
            body { background: white; height: auto; overflow: visible; display: block; }
            .ambient-light, .scene-container, .ui-overlay, .fab-container { display: none !important; }
            #print-area { display: block !important; width: 100%; direction: rtl; color: #000; }
            .print-slide { page-break-after: always; padding: 40px; text-align: right; font-family: 'Cairo', sans-serif;}
            .print-slide h1 { color: #2d3436; font-size: 32px; border-bottom: 2px solid #00b894; padding-bottom: 10px; margin-bottom: 20px; }
            .print-slide p { font-size: 18px; line-height: 1.8; color: #636e72; margin-bottom: 30px;}
            .print-slide img { max-width: 100%; max-height: 500px; object-fit: contain; border: 1px solid #dfe6e9; border-radius: 10px;}
        }

    </style>
</head>
<body>

    <div class="ambient-light" id="ambient-light"></div>

    <div class="scene-container" id="scene-container">
        
        <!-- 1. نموذج الاستاند -->
        <div id="theme-easel" class="theme-container active">
            <div class="easel-group" id="easel-model">
                <div class="wood leg-left"></div>
                <div class="wood leg-right"></div>
                <div class="wood leg-center"></div>
                <div class="wood shelf"></div>
                
                <div class="easel-canvas" id="easel-board">
                    <img id="easel-img" class="easel-media" src="" alt="Slide Image">
                    <video id="easel-video" class="easel-media" src="" loop muted autoplay controls playsinline style="display:none; pointer-events: auto;"></video>
                </div>
            </div>
            
            <div class="easel-text-layer">
                <div class="easel-text-box" id="easel-text"></div>
            </div>
        </div>

        <!-- 2. نموذج الكتاب -->
        <div id="theme-book" class="theme-container">
            <div class="book-scene closed-front" id="book-model">
                <div class="book-static-part" id="book-static-part">
                    <div class="book-page-left-face">
                        <img id="book-img" class="book-media" src="">
                        <video id="book-video" class="book-media" src="" loop muted autoplay controls playsinline style="display:none; pointer-events: auto;"></video>
                    </div>
                    <div class="book-cover-back-face" id="book-cover-back">
                        <img id="cover-back-img" class="cover-media" src="">
                        <video id="cover-back-video" class="cover-media" src="" loop muted autoplay controls playsinline style="display:none; pointer-events: auto;"></video>
                        <h1 class="cover-heading" id="cover-back-title"></h1>
                        <p class="cover-para" id="cover-back-desc"></p>
                    </div>
                </div>

                <div class="book-page-flip" id="book-flipper"></div>

                <div class="book-front-wrapper" id="book-front-wrapper">
                    <div class="book-cover-front-face" id="book-cover-front">
                        <img id="cover-front-img" class="cover-media" src="">
                        <video id="cover-front-video" class="cover-media" src="" loop muted autoplay controls playsinline style="display:none; pointer-events: auto;"></video>
                        <h1 class="cover-heading" id="cover-front-title"></h1>
                        <p class="cover-para" id="cover-front-desc"></p>
                    </div>
                    <div class="book-page-right-face">
                        <div id="book-text" class="page-text-content"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. نموذج الهولوجرام -->
        <div id="theme-hologram" class="theme-container">
            <div class="holo-scene">
                <div class="holo-base"></div>
                <div class="holo-screen">
                    <div class="holo-text-container">
                        <div id="holo-text"></div>
                    </div>
                    <div class="holo-img-container">
                        <img id="holo-img" class="holo-media" src="">
                        <video id="holo-video" class="holo-media" src="" loop muted autoplay controls playsinline style="display:none; pointer-events: auto;"></video>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. نموذج قاعة المسرح السينمائي -->
        <div id="theme-cinema" class="theme-container">
            <div class="cinema-scene closed">
                <div class="curtain curtain-left"></div>
                <div class="curtain curtain-right"></div>
                <div class="cinema-screen-container">
                    <img id="cinema-img" class="cinema-media" src="">
                    <video id="cinema-video" class="cinema-media" src="" loop muted autoplay controls playsinline style="display:none; pointer-events: auto;"></video>
                </div>
                <div class="cinema-subtitles">
                    <h1 class="cinema-title" id="cinema-title"></h1>
                    <p class="cinema-para" id="cinema-text"></p>
                </div>
            </div>
        </div>

        <!-- 5. نموذج المخطوطة الأثرية -->
        <div id="theme-scroll" class="theme-container">
            <div class="scroll-scene">
                <div class="scroll-roller scroll-top-roller"></div>
                <div class="scroll-paper">
                    <div class="scroll-content-wrapper" id="scroll-content">
                        <h1 class="scroll-title" id="scroll-title"></h1>
                        <div class="scroll-media-box">
                            <img id="scroll-img" class="scroll-media" src="">
                            <video id="scroll-video" class="scroll-media" src="" loop muted autoplay controls playsinline style="display:none; pointer-events: auto;"></video>
                        </div>
                        <p class="scroll-para" id="scroll-text"></p>
                    </div>
                </div>
                <div class="scroll-roller scroll-bottom-roller"></div>
            </div>
        </div>

    </div>

    <div class="ui-overlay">
        <div class="top-bar">
            <div class="theme-selector">
                <button class="theme-btn active" onclick="switchTheme('easel', this)">🎨 ستاند اللوحات</button>
                <button class="theme-btn" onclick="switchTheme('book', this)">📖 الكتاب التفاعلي</button>
                <button class="theme-btn" onclick="switchTheme('hologram', this)">🌐 هولوجرام</button>
                <button class="theme-btn" onclick="switchTheme('cinema', this)">🎬 قاعة المسرح</button>
                <button class="theme-btn" onclick="switchTheme('scroll', this)">📜 المخطوطة الأثرية</button>
            </div>
            <div class="action-btns">
                <button class="toggle-editor-btn" onclick="toggleEditor()">✏️ تعديل العرض</button>
                <button onclick="toggleFullScreen()">⛶ ملء الشاشة</button>
            </div>
        </div>

        <!-- لوحة التعديل الجانبية -->
        <div class="editor-panel" id="editor-panel">
            <h3>تعديل الشريحة الحالية (<span id="edit-slide-num">1</span>)</h3>
            
            <label>عنوان الشريحة:</label>
            <input type="text" id="edit-title" placeholder="أدخل العنوان هنا...">
            
            <label>المحتوى والنص:</label>
            <textarea id="edit-text" placeholder="أدخل محتوى الشريحة..."></textarea>
            
            <label>تغيير (صورة / فيديو / GIF متحرك):</label>
            <input type="file" id="edit-media" accept="image/*, video/*, .gif">

            <div style="margin-top: 10px;">
                <button class="btn-save" style="width: 100%; margin-bottom: 15px;" onclick="saveSlideEdits()">💾 حفظ التعديلات</button>
            </div>

            <div class="editor-btns">
                <button class="btn-add" onclick="addNewSlide()">+ شريحة جديدة</button>
                <button class="btn-del" onclick="deleteCurrentSlide()">🗑️ حذف الشريحة</button>
            </div>
        </div>

        <div class="bottom-bar">
            <button class="nav-btn" onclick="changeSlide(1)">التالي ❮</button>
            <div class="slide-counter"><span id="currentNum">1</span> / <span id="totalNum">3</span></div>
            <button class="nav-btn" onclick="changeSlide(-1)">❯ السابق</button>
        </div>

        <!-- زر الإجراءات العائم (FAB) للاستيراد والتصدير -->
        <div class="fab-container">
            <button class="fab-btn" title="تصدير واستيراد">💾</button>
            <div class="fab-menu">
                <button class="fab-item" onclick="exportToPPTX()">📊 حفظ كـ PowerPoint</button>
                <button class="fab-item" onclick="exportToWord()">📄 حفظ كـ Word</button>
                <button class="fab-item" onclick="exportToPDF()">🖨️ حفظ كـ PDF</button>
                <button class="fab-item" onclick="exportJSON()">📦 تصدير ملف (Backup)</button>
                <button class="fab-item" onclick="document.getElementById('importJSON').click()">📥 استيراد ملف</button>
                <input type="file" id="importJSON" accept=".json" style="display: none;" onchange="importJSON(event)">
            </div>
        </div>
    </div>

    <!-- حاوية مخفية مخصصة للطباعة وتصدير الـ PDF -->
    <div id="print-area" style="display: none;"></div>

    <script>
        let slides = [
            { 
                title: "مقدمة العرض", 
                text: "أهلاً بك في <b>3D Presentation Studio</b>.<br><br>المنصة التفاعلية المخصصة لعرض مشاريعك بأسلوب مبتكر يكسر الملل التقليدي للباوربوينت.", 
                media: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=800&q=80",
                mediaType: 'image'
            },
            { 
                title: "النماذج الجديدة المذهلة", 
                text: "تم إضافة نماذج جديدة لتناسب جميع الأذواق!<br>جرب الآن (قاعة المسرح السينمائي) أو (المخطوطة الأثرية) من القائمة العلوية لتشاهد السحر ثلاثي الأبعاد.", 
                media: "https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?auto=format&fit=crop&w=800&q=80",
                mediaType: 'image' 
            },
            { 
                title: "خاتمة العرض والتفاعل", 
                text: "تذكر أنه يمكنك دائماً استخدام الماوس للتجول في البيئة ثلاثية الأبعاد.<br><br>كما يمكنك رفع فيديوهات وصور متحركة (GIF) وستعمل بكفاءة تامة.", 
                media: "https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=800&q=80",
                mediaType: 'image'
            }
        ];

        let currentSlide = 0;
        let currentTheme = 'easel'; 

        // دالة موحدة لضبط الوسائط (صورة أو فيديو) في الحاويات
        function setMediaSource(imgId, vidId, slide, opacityTarget = 1) {
            const img = document.getElementById(imgId);
            const vid = document.getElementById(vidId);
            const isVideo = slide.mediaType === 'video';
            
            if(isVideo) {
                img.style.display = 'none'; img.src = '';
                vid.style.display = 'block'; vid.src = slide.media; vid.load();
                vid.style.opacity = opacityTarget;
            } else {
                vid.style.display = 'none'; vid.src = '';
                img.style.display = 'block'; img.src = slide.media;
                img.style.opacity = opacityTarget;
            }
            return isVideo ? vid : img;
        }

        function updateEaselCanvasDims(mediaElem, isVideo) {
            const board = document.getElementById('easel-board');
            const maxW = 600, maxH = 500;
            let nW = isVideo ? mediaElem.videoWidth : mediaElem.naturalWidth;
            let nH = isVideo ? mediaElem.videoHeight : mediaElem.naturalHeight;
            if(!nW || !nH) { nW = 500; nH = 400; }
            let targetW = nW, targetH = nH;
            if (targetW > maxW) { targetH = (maxW / targetW) * targetH; targetW = maxW; }
            if (targetH > maxH) { targetW = (maxH / targetH) * targetW; targetH = maxH; }
            board.style.width = targetW + 'px'; board.style.height = targetH + 'px';
        }

        function loadSlide(index) {
            const slide = slides[index];
            document.getElementById('currentNum').innerText = index + 1;
            document.getElementById('totalNum').innerText = slides.length;
            syncEditorWithSlide(); 

            // 1. الاستاند
            if (currentTheme === 'easel') {
                const activeElem = setMediaSource('easel-img', 'easel-video', slide, 0);
                const setupDims = () => { updateEaselCanvasDims(activeElem, slide.mediaType === 'video'); activeElem.style.opacity = 1; };
                if (slide.mediaType === 'video') activeElem.onloadedmetadata = setupDims; else activeElem.onload = setupDims;
                
                const textBox = document.getElementById('easel-text');
                textBox.classList.remove('show');
                setTimeout(() => {
                    textBox.innerHTML = `<h1 style="font-family:'Amiri'; font-size:3rem; color:#00d2d3; margin-bottom:20px;">${slide.title}</h1><p style="font-size:1.3rem; line-height:1.8;">${slide.text}</p>`;
                    textBox.classList.add('show');
                }, 300);
            } 
            // 2. الكتاب
            else if (currentTheme === 'book') {
                const bookModel = document.getElementById('book-model');
                const frontWrapper = document.getElementById('book-front-wrapper');
                const staticPart = document.getElementById('book-static-part');
                const flipper = document.getElementById('book-flipper');
                const textContent = document.getElementById('book-text');

                if (index === 0) {
                    bookModel.className = "book-scene closed-front";
                    frontWrapper.classList.remove('open'); staticPart.classList.remove('close-to-right');
                    setMediaSource('cover-front-img', 'cover-front-video', slide);
                    document.getElementById('cover-front-title').innerText = slide.title;
                    document.getElementById('cover-front-desc').innerHTML = slide.text;
                } 
                else if (index === slides.length - 1) {
                    bookModel.className = "book-scene closed-back";
                    frontWrapper.classList.add('open'); staticPart.classList.add('close-to-right');
                    setMediaSource('cover-back-img', 'cover-back-video', slide);
                    document.getElementById('cover-back-title').innerText = slide.title;
                    document.getElementById('cover-back-desc').innerHTML = slide.text;
                }
                else {
                    bookModel.className = "book-scene open-inside";
                    frontWrapper.classList.add('open'); staticPart.classList.remove('close-to-right');
                    textContent.classList.remove('show');
                    flipper.classList.remove('animate'); void flipper.offsetWidth; flipper.classList.add('animate');

                    setTimeout(() => {
                        setMediaSource('book-img', 'book-video', slide);
                        textContent.innerHTML = `<h2 class="book-heading">${slide.title}</h2><p class="book-para">${slide.text}</p>`;
                        textContent.classList.add('show');
                    }, 500); 
                }
            }
            // 3. الهولوجرام
            else if (currentTheme === 'hologram') {
                setMediaSource('holo-img', 'holo-video', slide);
                document.getElementById('holo-text').innerHTML = `<h1 class="holo-title">${slide.title}</h1><p class="holo-para">${slide.text}</p>`;
            }
            // 4. قاعة المسرح
            else if (currentTheme === 'cinema') {
                const cinemaScene = document.querySelector('.cinema-scene');
                
                // إذا كانت الشريحة الأولى أو الأخيرة، نغلق الستائر، وإلا نفتحها
                if (index === 0 || index === slides.length - 1) {
                    cinemaScene.classList.remove('open');
                    cinemaScene.classList.add('closed');
                } else {
                    cinemaScene.classList.remove('closed');
                    cinemaScene.classList.add('open');
                }

                const activeElem = setMediaSource('cinema-img', 'cinema-video', slide, 0);
                
                // تأخير ظهور الصورة قليلاً حتى تفتح الستارة
                setTimeout(() => { activeElem.style.opacity = 1; }, 600); 
                
                document.getElementById('cinema-title').innerText = slide.title;
                const para = document.getElementById('cinema-text');
                para.classList.remove('show');
                
                // النصوص تظهر فوق الستارة مباشرة
                setTimeout(() => { para.innerHTML = slide.text; para.classList.add('show'); }, 400);
            }
            // 5. المخطوطة الأثرية
            else if (currentTheme === 'scroll') {
                const wrapper = document.getElementById('scroll-content');
                const topRoller = document.querySelector('.scroll-top-roller');
                const bottomRoller = document.querySelector('.scroll-bottom-roller');
                const isEven = (index % 2 === 0);

                // إخفاء المحتوى الحالي بالاتجاه المناسب
                wrapper.classList.remove('show');
                wrapper.classList.add(isEven ? 'hide-bottom' : 'hide-top');
                
                setTimeout(() => {
                    // تبديل سماكة الأسطوانات لعمل تأثير التبادل في البرم
                    if (isEven) {
                        topRoller.classList.add('roller-thick'); topRoller.classList.remove('roller-thin');
                        bottomRoller.classList.add('roller-thin'); bottomRoller.classList.remove('roller-thick');
                    } else {
                        topRoller.classList.add('roller-thin'); topRoller.classList.remove('roller-thick');
                        bottomRoller.classList.add('roller-thick'); bottomRoller.classList.remove('roller-thin');
                    }

                    setMediaSource('scroll-img', 'scroll-video', slide);
                    document.getElementById('scroll-title').innerText = slide.title;
                    document.getElementById('scroll-text').innerHTML = slide.text;
                    
                    // نقل المحتوى للجهة المعاكسة بصمت (بدون أنيميشن) للتحضير للدخول
                    wrapper.classList.add('no-transition');
                    wrapper.classList.remove('hide-bottom', 'hide-top');
                    wrapper.classList.add(isEven ? 'hide-top' : 'hide-bottom'); 
                    
                    void wrapper.offsetWidth; // إجبار المتصفح على قراءة التغيير فوراً
                    
                    // إظهار المحتوى الجديد
                    wrapper.classList.remove('no-transition');
                    wrapper.classList.remove('hide-top', 'hide-bottom');
                    wrapper.classList.add('show');
                }, 500);
            }
        }

        function switchTheme(themeName, btnElement) {
            currentTheme = themeName;
            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            document.querySelectorAll('.theme-container').forEach(container => container.classList.remove('active'));
            document.getElementById(`theme-${themeName}`).classList.add('active');

            const ambient = document.getElementById('ambient-light');
            if(themeName === 'hologram') ambient.style.background = 'radial-gradient(ellipse at top, rgba(0, 210, 211, 0.15) 0%, rgba(0, 0, 0, 0) 70%)';
            else if(themeName === 'book') ambient.style.background = 'radial-gradient(ellipse at top, rgba(212, 175, 55, 0.1) 0%, rgba(0, 0, 0, 0) 70%)';
            else if(themeName === 'cinema') ambient.style.background = 'radial-gradient(ellipse at center, rgba(128, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.8) 100%)';
            else if(themeName === 'scroll') ambient.style.background = 'radial-gradient(ellipse at center, rgba(139, 69, 19, 0.1) 0%, rgba(0, 0, 0, 0.9) 100%)';
            else ambient.style.background = 'radial-gradient(ellipse at top, rgba(255, 255, 255, 0.1) 0%, rgba(0, 0, 0, 0) 70%)';

            resetVRView();
            loadSlide(currentSlide);
        }

        function changeSlide(step) {
            currentSlide += step;
            if (currentSlide < 0) currentSlide = 0;
            if (currentSlide >= slides.length) currentSlide = slides.length - 1;
            loadSlide(currentSlide);
        }

        function toggleEditor() { document.getElementById('editor-panel').classList.toggle('open'); }

        function syncEditorWithSlide() {
            document.getElementById('edit-slide-num').innerText = currentSlide + 1;
            document.getElementById('edit-title').value = slides[currentSlide].title;
            document.getElementById('edit-text').value = slides[currentSlide].text.replace(/<br>/g, '\n');
            document.getElementById('edit-media').value = ''; 
        }

        function saveSlideEdits() {
            const newTitle = document.getElementById('edit-title').value;
            const newText = document.getElementById('edit-text').value.replace(/\n/g, '<br>');
            const fileInput = document.getElementById('edit-media');
            slides[currentSlide].title = newTitle;
            slides[currentSlide].text = newText;

            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const isVideo = file.type.startsWith('video/');
                const reader = new FileReader();
                reader.onload = function(e) {
                    slides[currentSlide].media = e.target.result;
                    slides[currentSlide].mediaType = isVideo ? 'video' : 'image';
                    loadSlide(currentSlide); 
                }
                reader.readAsDataURL(file);
            } else {
                loadSlide(currentSlide); 
            }
        }

        function addNewSlide() {
            const newSlide = {
                title: "شريحة جديدة",
                text: "اضغط على حفظ التعديلات لتغيير هذا النص.",
                media: "https://placehold.co/800x600/34495e/ecf0f1?text=New+Slide",
                mediaType: 'image'
            };
            slides.splice(currentSlide + 1, 0, newSlide);
            changeSlide(1); 
        }

        function deleteCurrentSlide() {
            if (slides.length <= 3) {
                alert("لا يمكن الحذف! الحد الأدنى المسموح به هو 3 شرائح (غلاف، محتوى، خاتمة).");
                return;
            }
            if(confirm("هل أنت متأكد من حذف هذه الشريحة؟")) {
                slides.splice(currentSlide, 1);
                if(currentSlide >= slides.length) currentSlide = slides.length - 1;
                loadSlide(currentSlide);
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        // =====================================
        // دوال الاستيراد والتصدير (JSON, Word, PPTX, PDF)
        // =====================================

        // 1. تصدير واستيراد JSON
        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(slides));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "presentation_backup.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedSlides = JSON.parse(e.target.result);
                    if (Array.isArray(importedSlides) && importedSlides.length >= 3) {
                        slides = importedSlides;
                        currentSlide = 0;
                        loadSlide(currentSlide);
                        alert("تم استيراد العرض بنجاح!");
                    } else {
                        alert("ملف غير صالح! يجب أن يحتوي العرض على 3 شرائح كحد أدنى.");
                    }
                } catch (error) {
                    alert("حدث خطأ أثناء قراءة الملف.");
                }
            };
            reader.readAsText(file);
        }

        // 2. تصدير PDF (عن طريق الطباعة)
        function exportToPDF() {
            const printArea = document.getElementById('print-area');
            printArea.innerHTML = ''; // تفريغ الحاوية
            
            slides.forEach(slide => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'print-slide';
                let mediaHTML = '';
                if(slide.mediaType === 'image') {
                    mediaHTML = `<img src="${slide.media}" alt="Slide Image">`;
                } else {
                    mediaHTML = `<p style="color:red; border:1px solid red; padding:10px;">[ملف فيديو: لا يظهر في الطباعة]</p>`;
                }
                
                slideDiv.innerHTML = `
                    <h1>${slide.title}</h1>
                    <p>${slide.text}</p>
                    ${mediaHTML}
                `;
                printArea.appendChild(slideDiv);
            });
            
            window.print();
        }

        // 3. تصدير Word (MHTML)
        function exportToWord() {
            let htmlContent = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head>
                    <meta charset='utf-8'>
                    <style>
                        body { font-family: 'Arial', sans-serif; direction: rtl; text-align: right; }
                        h1 { color: #2d3436; border-bottom: 2px solid #0984e3; padding-bottom: 10px; }
                        p { font-size: 16px; line-height: 1.6; }
                        img { max-width: 100%; border: 1px solid #ccc; margin-top: 15px;}
                        .page-break { page-break-after: always; }
                    </style>
                </head><body>
            `;
            
            slides.forEach((slide, index) => {
                htmlContent += `<h1>${slide.title}</h1>`;
                htmlContent += `<p>${slide.text}</p>`;
                if(slide.mediaType === 'image' && slide.media) {
                    htmlContent += `<img src="${slide.media}"><br>`;
                }
                if (index < slides.length - 1) htmlContent += `<div class='page-break'></div>`;
            });
            
            htmlContent += "</body></html>";
            
            const blob = new Blob(['\ufeff', htmlContent], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const downloadLink = document.createElement("a");
            downloadLink.href = url;
            downloadLink.download = "Presentation.doc";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        // 4. تصدير PowerPoint (عبر مكتبة PptxGenJS)
        async function loadScript(url) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = url;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        async function exportToPPTX() {
            alert("جاري تجهيز ملف الباوربوينت، قد يستغرق الأمر بضع ثوانٍ لجمع الصور والبيانات...");
            
            // تحميل المكتبات ديناميكياً إذا لم تكن موجودة
            if (typeof pptxgen === 'undefined') {
                try {
                    await loadScript("https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/libs/jszip.min.js");
                    await loadScript("https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js");
                } catch (e) {
                    alert("فشل في تحميل مكتبة الباوربوينت، يرجى التأكد من اتصال الإنترنت.");
                    return;
                }
            }

            let pptx = new pptxgen();
            pptx.rtlMode = true; // دعم اللغة العربية
            
            slides.forEach(s => {
                let slide = pptx.addSlide();
                
                // تنظيف النص من أكواد HTML
                let cleanText = s.text.replace(/<br\s*[\/]?>/gi, "\n").replace(/<[^>]+>/g, "");
                
                slide.addText(s.title, { x: 0.5, y: 0.5, w: '90%', fontSize: 28, bold: true, color: '0984e3', align: 'right', isTextBox: true });
                slide.addText(cleanText, { x: 0.5, y: 1.2, w: '90%', fontSize: 18, color: '2d3436', align: 'right', isTextBox: true });
                
                if(s.mediaType === 'image' && s.media) {
                    try {
                        // إضافة الصورة في منتصف الشريحة السفلي
                        slide.addImage({ data: s.media, x: 1, y: 2.5, w: 8, h: 4.5, sizing: {type: 'contain'} });
                    } catch(e) { console.log("تعذر تضمين هذه الصورة في PPTX"); }
                }
            });
            
            pptx.writeFile({ fileName: "3D_Presentation.pptx" });
        }


        // =====================================
        // نظام تحريك الكاميرا في العالم الافتراضي
        // =====================================
        const sceneContainer = document.getElementById('scene-container'); 
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let camRotateX = 0, camRotateY = 0, camTranslateZ = 0, camTranslateX = 0, camTranslateY = 0; 

        function updateSceneTransform() {
            sceneContainer.style.transform = `
                translateZ(${camTranslateZ}px) translateX(${camTranslateX}px) translateY(${camTranslateY}px) 
                rotateX(${camRotateX}deg) rotateY(${camRotateY}deg)
            `;
        }

        function resetVRView() {
            camRotateX = 0; camRotateY = 0; camTranslateZ = 0; camTranslateX = 0; camTranslateY = 0;
            sceneContainer.style.transition = 'transform 1s ease-in-out';
            updateSceneTransform();
        }

        document.addEventListener('mousedown', (e) => {
            if(e.target.closest('button') || e.target.closest('.ui-overlay') || e.target.closest('.editor-panel') || e.target.closest('video')) return;
            isDragging = true;
            previousMousePosition = { x: e.pageX, y: e.pageY };
            sceneContainer.style.transition = 'none'; 
            document.body.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const deltaMove = { x: e.pageX - previousMousePosition.x, y: e.pageY - previousMousePosition.y };
            camRotateY += deltaMove.x * 0.2; 
            camRotateX -= deltaMove.y * 0.2;
            camRotateX = Math.max(-30, Math.min(30, camRotateX));
            previousMousePosition = { x: e.pageX, y: e.pageY };
            updateSceneTransform();
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            document.body.style.cursor = 'default';
            sceneContainer.style.transition = 'transform 0.5s ease-out';
            updateSceneTransform();
        });

        document.addEventListener('wheel', (e) => {
            if(e.target.closest('.editor-panel')) return; 
            camTranslateZ += e.deltaY * -2;
            camTranslateZ = Math.max(-2000, Math.min(1500, camTranslateZ));
            sceneContainer.style.transition = 'transform 0.2s ease-out';
            updateSceneTransform();
        });

        window.onload = () => loadSlide(0);

    </script>
</body>
</html>
