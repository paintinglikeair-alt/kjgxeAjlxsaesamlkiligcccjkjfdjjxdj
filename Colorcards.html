<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كوتشينة أسرار الألوان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at center, #1e293b, #0f172a);
            color: white;
            overflow: hidden;
            touch-action: manipulation; /* لمنع التكبير العشوائي على الموبايل */
        }

        .playing-card {
            width: 80px;
            height: 120px;
            background-color: white;
            border-radius: 12px;
            border: 4px solid #e2e8f0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            user-select: none;
        }

        @media (min-width: 768px) {
            .playing-card { width: 100px; height: 150px; }
        }

        .playing-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.5);
        }

        .playing-card:active {
            transform: scale(0.95);
        }

        .card-inner-color {
            width: 70%;
            height: 60%;
            border-radius: 8px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .card-label {
            color: #1e293b;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* ألوان البطاقات الأساسية */
        .color-red .card-inner-color { background-color: #ef4444; }
        .color-yellow .card-inner-color { background-color: #facc15; }
        .color-blue .card-inner-color { background-color: #3b82f6; }
        .color-white .card-inner-color { background-color: #f8fafc; border: 1px solid #cbd5e1; }
        .color-black .card-inner-color { background-color: #0f172a; }

        /* ألوان البطاقات المستهدفة */
        .target-orange .card-inner-color { background-color: #f97316; }
        .target-light_orange .card-inner-color { background-color: #fdba74; }
        .target-purple .card-inner-color { background-color: #a855f7; }
        .target-light_purple .card-inner-color { background-color: #d8b4fe; }
        .target-green .card-inner-color { background-color: #22c55e; }
        .target-light_green .card-inner-color { background-color: #86efac; }
        .target-brown .card-inner-color { background-color: #78350f; }
        .target-light_brown .card-inner-color { background-color: #b45309; }
        .target-gray .card-inner-color { background-color: #94a3b8; }
        .target-target_black .card-inner-color { background-color: #000000; box-shadow: 0 0 10px rgba(255,255,255,0.2); }

        #table-zone {
            min-height: 160px;
            border: 3px dashed #475569;
            background-color: rgba(30, 41, 59, 0.5);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 10px;
            flex-wrap: wrap;
        }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-50px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
            pointer-events: none;
        }
        .notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="flex flex-col h-screen w-full">

    <header class="bg-gray-900 border-b-4 border-indigo-600 p-4 shadow-lg flex justify-between items-center z-10 shrink-0">
        <h1 class="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 drop-shadow-md">
            🎨 كوتشينة الألوان
        </h1>
        <div class="flex gap-4">
            <div class="bg-gray-800 border-2 border-green-500 rounded-xl px-4 py-2 flex items-center gap-2 shadow-inner">
                <span class="text-xl">⭐</span>
                <span class="text-xl font-bold text-green-400" id="score">0</span>
            </div>
            <div class="bg-gray-800 border-2 border-blue-500 rounded-xl px-4 py-2 flex items-center gap-2 shadow-inner">
                <span class="text-xl">🏆</span>
                <span class="text-xl font-bold text-blue-400" id="level-display">مستوى 1</span>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col p-4 overflow-hidden gap-4">
        
        <!-- The Computer's Challenge -->
        <div class="flex flex-col items-center shrink-0">
            <h2 class="text-lg text-gray-300 mb-2 font-bold">بطاقة التحدي (الكمبيوتر):</h2>
            <div id="target-card-container" class="animate-pop">
                <!-- Target card injected here -->
            </div>
            <p class="mt-2 text-yellow-300 font-bold text-sm bg-gray-800/80 px-4 py-1 rounded-full">
                ضع كروتك على الطاولة لتكوين هذا اللون!
            </p>
        </div>

        <!-- The Table (Mixing Zone) -->
        <div class="flex-1 flex flex-col w-full max-w-4xl mx-auto">
            <div id="table-zone" class="w-full relative shadow-[inset_0_0_20px_rgba(0,0,0,0.5)]">
                <span class="absolute text-gray-500 font-bold text-xl pointer-events-none select-none z-0 opacity-50" id="table-placeholder">
                    اضغط على كروتك لوضعها هنا
                </span>
                <!-- Played cards injected here -->
            </div>
            
            <div class="flex justify-center gap-4 mt-4 shrink-0">
                <button onclick="checkCombination()" class="bg-gradient-to-b from-green-500 to-green-700 hover:from-green-400 hover:to-green-600 text-white font-bold py-3 px-8 rounded-xl border-b-4 border-green-900 active:border-b-0 active:translate-y-1 transition-all shadow-lg text-xl flex items-center gap-2">
                    <span>✨</span> دمج وتحقق
                </button>
                <button onclick="resetTable()" class="bg-gradient-to-b from-red-500 to-red-700 hover:from-red-400 hover:to-red-600 text-white font-bold py-3 px-6 rounded-xl border-b-4 border-red-900 active:border-b-0 active:translate-y-1 transition-all shadow-lg text-xl">
                    🔄 إرجاع الكروت
                </button>
            </div>
        </div>

        <div class="mt-auto shrink-0 bg-gray-800/80 p-4 rounded-t-3xl border-t-2 border-gray-600 shadow-[0_-10px_20px_rgba(0,0,0,0.3)]">
            <h2 class="text-center text-gray-300 mb-2 font-bold">كروتك (يدك):</h2>
            <div id="hand-zone" class="flex justify-center flex-wrap gap-2 md:gap-4 max-w-5xl mx-auto">
                <!-- Player cards injected here -->
            </div>
        </div>
    </main>

    <!-- Custom Notification -->
    <div id="notification" class="notification bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-8 py-4 rounded-full shadow-[0_10px_30px_rgba(0,0,0,0.8)] font-bold text-xl border-2 border-purple-300">
        رسالة
    </div>

    <script>
        // Audio Setup
        let synth, successSound, errorSound, clickSound;
        let audioInitialized = false;

        function initAudio() {
            if(audioInitialized) return;
            Tone.start();
            
            clickSound = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination();
            clickSound.volume.value = -15;
            
            successSound = new Tone.PolySynth(Tone.Synth).toDestination();
            successSound.volume.value = -10;
            
            errorSound = new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.1, decay: 0.2, sustain: 0.1, release: 0.5 } }).toDestination();
            errorSound.volume.value = -12;
            
            audioInitialized = true;
        }

        window.addEventListener('mousedown', initAudio);
        window.addEventListener('touchstart', initAudio);

        // Game Configuration and Recipes based on User Rules
        const BASE_CARDS = {
            'red': { name: 'أحمر' },
            'yellow': { name: 'أصفر' },
            'blue': { name: 'أزرق' },
            'white': { name: 'أبيض' }
        };

        const TARGET_CARDS = {
            'orange': { name: 'برتقالي', class: 'target-orange' },
            'light_orange': { name: 'برتقالي فاتح', class: 'target-light_orange' },
            'purple': { name: 'بنفسجي', class: 'target-purple' },
            'light_purple': { name: 'بنفسجي فاتح', class: 'target-light_purple' },
            'green': { name: 'أخضر', class: 'target-green' },
            'light_green': { name: 'أخضر فاتح', class: 'target-light_green' },
            'brown': { name: 'بني', class: 'target-brown' },
            'light_brown': { name: 'بني فاتح', class: 'target-light_brown' },
            'gray': { name: 'رمادي', class: 'target-gray' },
            'target_black': { name: 'أسود', class: 'target-target_black' }
        };

        // Recipes strictly following user instructions
        const RECIPES = {
            'orange': ['red', 'yellow'],
            'light_orange': ['red', 'yellow', 'white'],
            'purple': ['red', 'blue'],
            'light_purple': ['red', 'blue', 'white'],
            'green': ['blue', 'yellow'],
            'light_green': ['blue', 'yellow', 'white'],
            'brown': ['red', 'blue', 'yellow', 'yellow'], // As requested: Red + Blue + 2 Yellow
            'light_brown': ['red', 'blue', 'white', 'yellow', 'yellow'], // Red + Blue + White + 2 Yellow
            'gray': ['red', 'yellow', 'white', 'blue', 'blue'], // Red + Yellow + White + 2 Blue
            'target_black': ['red', 'yellow', 'blue', 'blue'] // As requested: Red + Yellow + 2 Blue
        };

        // Standard 8 card deck every round
        const STANDARD_HAND = [
            'red', 'red', 'yellow', 'yellow', 'blue', 'blue', 'white', 'white'
        ];

        // إعدادات المستويات والألوان الخاصة بكل مستوى
        const LEVEL_TARGETS = {
            1: ['orange', 'purple', 'green'],
            2: ['light_orange', 'light_purple', 'light_green'],
            3: ['brown', 'target_black'],
            4: ['light_brown', 'gray']
        };

        // Game State
        let state = {
            score: 0,
            level: 1,
            currentTarget: '',
            hand: [],
            table: []
        };

        function renderCard(type, isTarget = false, index = null, location = '') {
            if (isTarget) {
                const data = TARGET_CARDS[type];
                return `
                    <div class="playing-card ${data.class} scale-110 pointer-events-none">
                        <div class="card-inner-color"></div>
                        <div class="card-label">${data.name}</div>
                    </div>
                `;
            } else {
                const data = BASE_CARDS[type];
                return `
                    <div class="playing-card color-${type} animate-pop" onclick="moveCard(${index}, '${location}')">
                        <div class="card-inner-color"></div>
                        <div class="card-label">${data.name}</div>
                    </div>
                `;
            }
        }

        function updateUI() {
            // Update Score & Round
            document.getElementById('score').innerText = state.score;
            document.getElementById('level-display').innerText = `مستوى ${state.level}`;

            // Render Target
            document.getElementById('target-card-container').innerHTML = renderCard(state.currentTarget, true);

            // Render Hand
            const handZone = document.getElementById('hand-zone');
            handZone.innerHTML = state.hand.map((card, idx) => renderCard(card, false, idx, 'hand')).join('');

            // Render Table
            const tableZone = document.getElementById('table-zone');
            const placeholder = document.getElementById('table-placeholder');
            
            if (state.table.length === 0) {
                placeholder.style.display = 'block';
                // keep only the placeholder
                tableZone.innerHTML = placeholder.outerHTML; 
            } else {
                placeholder.style.display = 'none';
                tableZone.innerHTML = placeholder.outerHTML + state.table.map((card, idx) => renderCard(card, false, idx, 'table')).join('');
            }
        }

        function showNotification(text, type = 'success') {
            const notif = document.getElementById('notification');
            notif.innerText = text;
            if (type === 'error') {
                notif.className = 'notification bg-gradient-to-r from-red-600 to-rose-600 text-white px-8 py-4 rounded-full shadow-2xl font-bold text-xl border-2 border-red-300';
            } else {
                notif.className = 'notification bg-gradient-to-r from-green-500 to-emerald-600 text-white px-8 py-4 rounded-full shadow-2xl font-bold text-xl border-2 border-green-300';
            }
            
            notif.classList.add('show');
            setTimeout(() => { notif.classList.remove('show'); }, 2500);
        }

        function moveCard(index, fromLocation) {
            initAudio();
            if(clickSound) clickSound.triggerAttackRelease("C5", "32n");

            if (fromLocation === 'hand') {
                // Move from Hand to Table
                const card = state.hand.splice(index, 1)[0];
                state.table.push(card);
            } else if (fromLocation === 'table') {
                // Move from Table to Hand
                const card = state.table.splice(index, 1)[0];
                state.hand.push(card);
            }
            updateUI();
        }

        function resetTable() {
            if(state.table.length === 0) return;
            initAudio();
            if(clickSound) clickSound.triggerAttackRelease("G4", "32n");
            
            state.hand = state.hand.concat(state.table);
            // Sort hand slightly to keep colors together
            state.hand.sort();
            state.table = [];
            updateUI();
        }

        function startRound() {
            // Reset hand to the exact 10 cards
            state.hand = [...STANDARD_HAND];
            state.table = [];
            
            // Pick random target بناءً على المستوى الحالي
            const targets = LEVEL_TARGETS[state.level];
            const prevTarget = state.currentTarget;
            do {
                state.currentTarget = targets[Math.floor(Math.random() * targets.length)];
            } while (state.currentTarget === prevTarget && targets.length > 1); // Avoid repeating same color immediately

            // Animate target card container
            const targetContainer = document.getElementById('target-card-container');
            targetContainer.classList.remove('animate-pop');
            void targetContainer.offsetWidth; // trigger reflow
            targetContainer.classList.add('animate-pop');

            updateUI();
        }

        function checkCombination() {
            initAudio();
            
            if (state.table.length === 0) {
                showNotification("لم تضع أي كروت على الطاولة!", 'error');
                if(errorSound) errorSound.triggerAttackRelease("C3", "8n");
                document.getElementById('table-zone').classList.add('animate-shake');
                setTimeout(() => document.getElementById('table-zone').classList.remove('animate-shake'), 400);
                return;
            }

            const requiredRecipe = [...RECIPES[state.currentTarget]].sort();
            const playedCards = [...state.table].sort();

            // Check if arrays are exactly equal
            const isCorrect = JSON.stringify(requiredRecipe) === JSON.stringify(playedCards);

            if (isCorrect) {
                // Success
                state.score += 10;
                
                // حساب المستوى الجديد (كل 30 نقطة ترتقي لمستوى جديد بحد أقصى المستوى 4)
                let nextLevel = Math.min(4, Math.floor(state.score / 30) + 1);
                
                if (nextLevel > state.level) {
                    state.level = nextLevel;
                    showNotification(`🎉 رائع! لقد ارتقيت للمستوى ${state.level}!`);
                    if(successSound) successSound.triggerAttackRelease(["C5", "E5", "G5", "C6"], "2n");
                } else {
                    showNotification(`🎉 ممتاز! إجابة صحيحة +10 نقطة`);
                    if(successSound) successSound.triggerAttackRelease(["C4", "E4", "G4", "C5"], "4n");
                }
                
                // Wait a bit before starting next round
                setTimeout(() => {
                    startRound();
                }, 1500);

            } else {
                // Fail
                showNotification("❌ المزيج غير صحيح.. حاول مرة أخرى", 'error');
                if(errorSound) errorSound.triggerAttackRelease("E2", "8n");
                
                const tableZone = document.getElementById('table-zone');
                tableZone.classList.add('animate-shake');
                setTimeout(() => tableZone.classList.remove('animate-shake'), 400);
                
                // Return cards to hand after brief delay
                setTimeout(() => {
                    resetTable();
                }, 1000);
            }
        }

        // Init game
        window.onload = () => {
            startRound();
        };

    </script>
</body>
</html>
