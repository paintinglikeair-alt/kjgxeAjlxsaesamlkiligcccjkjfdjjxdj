 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختبر الليزر والمرايا 🔦 - النسخة الاحترافية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #020617;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 30px 30px;
            color: #f8fafc;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        canvas {
            background-color: #0f172a;
            border: 4px solid #334155;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.1), inset 0 0 20px rgba(0, 0, 0, 0.8);
            cursor: pointer;
            max-width: 100%;
            max-height: 65vh;
        }

        /* نافذة الرسائل */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #modal-content {
            background: linear-gradient(145deg, #0f172a, #020617);
            border: 2px solid #10b981;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s ease;
            box-shadow: 0 10px 50px rgba(16, 185, 129, 0.2);
            max-width: 90%;
            width: 400px;
        }

        .btn-game {
            background: linear-gradient(to bottom, #10b981, #059669);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.4);
        }

        .btn-game:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.6);
        }
        
        .btn-game:active {
            transform: translateY(1px);
        }

        .btn-reset {
            background: linear-gradient(to bottom, #ef4444, #b91c1c);
            box-shadow: 0 4px 10px rgba(185, 28, 28, 0.4);
        }
        
        .btn-reset:hover {
            box-shadow: 0 6px 15px rgba(185, 28, 28, 0.6);
        }

        .mirror-icon {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 2px solid #94a3b8;
            border-radius: 4px;
            background: #334155;
            position: relative;
        }
        .mirror-icon::after {
            content: '';
            position: absolute;
            width: 140%;
            height: 3px;
            background: #10b981;
            top: 50%;
            left: -20%;
            transform: rotate(45deg);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="w-full max-w-3xl flex flex-col sm:flex-row justify-between items-center px-6 py-4 mb-4 bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl gap-4">
            <div class="text-center sm:text-right">
                <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-500 mb-1">
                    مختبر الليزر ⚡
                </h1>
                <p id="tutorial-text" class="text-xs text-slate-400 font-bold max-w-md">انقر على المربعات الفارغة لوضع مرايا وتوجيه الشعاع</p>
            </div>
            
            <div class="flex items-center gap-3 bg-slate-950 p-2 rounded-2xl border border-slate-800">
                <div class="text-center px-4">
                    <span class="block text-[10px] text-slate-500 font-bold uppercase">المستوى</span>
                    <span id="ui-level" class="text-2xl font-black text-white">1</span>
                </div>
                <div class="w-px h-8 bg-slate-800"></div>
                <div class="text-center px-4">
                    <span class="block text-[10px] text-slate-500 font-bold uppercase">المرايا</span>
                    <div class="flex items-center justify-center gap-1">
                        <span id="ui-mirrors" class="text-2xl font-black text-emerald-400">0</span>
                    </div>
                </div>
                <button onclick="resetLevel()" class="btn-game btn-reset text-sm px-4 py-2 ml-2 rounded-xl flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
        </div>

        <!-- لوحة اللعب -->
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- نافذة نهاية المستوى -->
    <div id="modal-overlay">
        <div id="modal-content">
            <div class="text-6xl mb-4">🧠</div>
            <h2 id="modal-title" class="text-3xl font-black text-white mb-2">عبقري!</h2>
            <p id="modal-desc" class="text-slate-400 mb-6 font-bold text-sm">مسار هندسي مثالي. استعد للتحدي القادم.</p>
            <button onclick="nextLevel()" id="modal-btn" class="btn-game w-full text-lg py-3 rounded-xl shadow-lg shadow-emerald-500/20">التالي ➡️</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiLevel = document.getElementById('ui-level');
        const uiMirrors = document.getElementById('ui-mirrors');
        const tutorialText = document.getElementById('tutorial-text');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');
        
        let cols = 8;
        let rows = 8;
        let cellSize = 60;
        
        // رموز الخريطة:
        // . : فارغ
        // # : جدار
        // >,<,^,v : مصدر ليزر
        // T : الهدف
        // /,\ : مرايا ثابتة

        const LEVELS = [
            {
                mirrorsCount: 3,
                tutorial: "عذراً على الخطأ السابق! الجدار الآن به فتحة على اليمين. استخدم 3 مرايا للالتفاف حول الجدار ودخول الغرفة.",
                map: [
                    "........",
                    ".######.",
                    ".#....#.",
                    ".#.T....",
                    ".#....#.",
                    ".######.",
                    "........",
                    "^......."
                ]
            },
            {
                mirrorsCount: 8,
                tutorial: "الدوامة: ستحتاج لـ 8 مرايا لتوجيه الليزر في مسار حلزوني يلتف حول الجدران للوصول للعمق.",
                map: [
                    "........",
                    ".######.",
                    ".#....#.",
                    ".#.T..#.",
                    ".#....#.",
                    "...#..#.",
                    "........",
                    "^......."
                ]
            },
            {
                mirrorsCount: 3,
                tutorial: "المرايا الثابتة (الرمادية) إجبارية ولا يمكنك تغييرها! استفد منها لعكس مسارك وتوفير مراياك.",
                map: [
                    "........",
                    ".T..#...",
                    "....#.\\.",
                    "....#...",
                    ".####...",
                    "\\.......",
                    "........",
                    ".>......"
                ]
            },
            {
                mirrorsCount: 4,
                tutorial: "التقاطع: ابحث عن الفتحات الصحيحة لتجاوز الجدران وتمرير الليزر عبر الشبكة.",
                map: [
                    "##>....#",
                    "#####..#",
                    "##.....#",
                    "##.#####",
                    "##...T.#",
                    "######.#",
                    "##.....#",
                    "########"
                ]
            },
            {
                mirrorsCount: 6,
                tutorial: "الحصن الأخير! مسار واحد فقط مفتوح (اليسار)، يجب عليك الدوران حول الجدران الداخلية بحذر شديد.",
                map: [
                    "########",
                    "#......#",
                    "#.####.#",
                    "#.#T.#.#",
                    "#.#....#",
                    "#.####.#",
                    "#...#..#",
                    "###^####"
                ]
            }
        ];

        let currentLevelIndex = 0;
        let grid = [];
        let emitter = { r: 0, c: 0, dir: {r: 0, c: 1} };
        let target = { r: 0, c: 0 };
        let availableMirrors = 0;
        let isLevelComplete = false;
        let laserPath = [];
        let pulseTime = 0;

        function resizeCanvas() {
            const containerWidth = window.innerWidth * 0.95;
            const containerHeight = window.innerHeight * 0.65;
            
            cellSize = Math.min(containerWidth / cols, containerHeight / rows);
            if (cellSize > 70) cellSize = 70;
            if (cellSize < 35) cellSize = 35;
            
            canvas.width = cols * cellSize;
            canvas.height = rows * cellSize;
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            draw();
        });

        function loadLevel(index) {
            if(index >= LEVELS.length) {
                document.getElementById('modal-title').innerText = "ختمت اللعبة! 🏆";
                document.getElementById('modal-desc').innerText = "أنت تمتلك عقلاً هندسياً فذاً وتفكيراً فراغياً خارقاً.";
                document.getElementById('modal-btn').innerText = "العب من جديد 🔄";
                document.getElementById('modal-btn').onclick = () => {
                    currentLevelIndex = 0;
                    loadLevel(0);
                    closeModal();
                };
                modalOverlay.style.display = 'flex';
                setTimeout(() => modalOverlay.style.opacity = '1', 10);
                return;
            }

            const levelData = LEVELS[index];
            availableMirrors = levelData.mirrorsCount;
            tutorialText.innerText = levelData.tutorial || "وجه الليزر نحو الهدف";
            grid = [];
            isLevelComplete = false;

            for (let r = 0; r < rows; r++) {
                let rowArray = [];
                for (let c = 0; c < cols; c++) {
                    let char = levelData.map[r][c];
                    let cellData = { type: 'empty', isFixed: false };
                    
                    if (char === '#') { cellData.type = 'wall'; cellData.isFixed = true; } 
                    else if (char === 'T') { cellData.type = 'target'; cellData.isFixed = true; target = { r, c }; } 
                    else if (char === '>') { cellData.type = 'emitter'; cellData.isFixed = true; emitter = { r, c, dir: {r: 0, c: 1} }; } 
                    else if (char === '<') { cellData.type = 'emitter'; cellData.isFixed = true; emitter = { r, c, dir: {r: 0, c: -1} }; } 
                    else if (char === '^') { cellData.type = 'emitter'; cellData.isFixed = true; emitter = { r, c, dir: {r: -1, c: 0} }; } 
                    else if (char === 'v') { cellData.type = 'emitter'; cellData.isFixed = true; emitter = { r, c, dir: {r: 1, c: 0} }; } 
                    else if (char === '/') { cellData.type = 'mirror_slash'; cellData.isFixed = true; } 
                    else if (char === '\\') { cellData.type = 'mirror_backslash'; cellData.isFixed = true; }
                    
                    rowArray.push(cellData);
                }
                grid.push(rowArray);
            }

            uiLevel.innerText = index + 1;
            updateUI();
            resizeCanvas();
            calculateLaserPath();
        }

        function updateUI() {
            uiMirrors.innerText = availableMirrors;
            if(availableMirrors === 0) uiMirrors.classList.replace('text-emerald-400', 'text-slate-500');
            else uiMirrors.classList.replace('text-slate-500', 'text-emerald-400');
        }

        function resetLevel() {
            loadLevel(currentLevelIndex);
        }

        function reflect(dir, mirrorType) {
            if (mirrorType === 'mirror_slash') {
                return { r: -dir.c, c: -dir.r };
            } else if (mirrorType === 'mirror_backslash') {
                return { r: dir.c, c: dir.r };
            }
            return dir;
        }

        function calculateLaserPath() {
            laserPath = [];
            let currR = emitter.r;
            let currC = emitter.c;
            let currentDir = { r: emitter.dir.r, c: emitter.dir.c };
            
            laserPath.push({ r: currR, c: currC });
            
            let hitTarget = false;
            let visitedStates = new Set();
            
            while (true) {
                currR += currentDir.r;
                currC += currentDir.c;
                
                if (currR < 0 || currR >= rows || currC < 0 || currC >= cols) {
                    laserPath.push({ r: currR, c: currC });
                    break;
                }
                
                let cell = grid[currR][currC];
                
                if (cell.type === 'wall') {
                    laserPath.push({ r: currR, c: currC });
                    break;
                }
                
                laserPath.push({ r: currR, c: currC });
                
                if (cell.type === 'target') {
                    hitTarget = true;
                    break;
                }
                
                if (cell.type === 'emitter') break;

                if (cell.type === 'mirror_slash' || cell.type === 'mirror_backslash') {
                    let stateKey = `${currR},${currC},${currentDir.r},${currentDir.c}`;
                    if (visitedStates.has(stateKey)) break;
                    visitedStates.add(stateKey);
                    
                    currentDir = reflect(currentDir, cell.type);
                }
            }

            if (hitTarget && !isLevelComplete) {
                isLevelComplete = true;
                setTimeout(() => {
                    document.getElementById('modal-title').innerText = "أحسنت صنعاً!";
                    document.getElementById('modal-desc').innerText = "لقد حللت هذا اللغز المعقد بنجاح.";
                    document.getElementById('modal-btn').innerText = "التالي ➡️";
                    document.getElementById('modal-btn').onclick = nextLevel;
                    
                    modalOverlay.style.display = 'flex';
                    void modalOverlay.offsetWidth;
                    modalOverlay.style.opacity = '1';
                    modalContent.style.transform = 'scale(1)';
                }, 600);
            }
        }

        canvas.addEventListener('mousedown', handleInteraction);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInteraction(e.touches[0]);
        }, {passive: false});

        function handleInteraction(e) {
            if (isLevelComplete) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            
            const c = Math.floor(x / cellSize);
            const r = Math.floor(y / cellSize);
            
            if (r < 0 || r >= rows || c < 0 || c >= cols) return;
            
            let cell = grid[r][c];
            if (cell.isFixed) return;
            
            if (cell.type === 'empty' && availableMirrors > 0) {
                cell.type = 'mirror_slash';
                availableMirrors--;
            } 
            else if (cell.type === 'mirror_slash') {
                cell.type = 'mirror_backslash';
            } 
            else if (cell.type === 'mirror_backslash') {
                cell.type = 'empty';
                availableMirrors++;
            }
            
            updateUI();
            calculateLaserPath();
        }

        function drawCell(r, c, type) {
            const x = c * cellSize;
            const y = r * cellSize;
            const center = cellSize / 2;

            // خلفية الخلية
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(x, y, cellSize, cellSize);
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, cellSize, cellSize);

            if (type === 'wall') {
                ctx.fillStyle = '#1e293b';
                ctx.beginPath();
                ctx.roundRect(x + 2, y + 2, cellSize - 4, cellSize - 4, 6);
                ctx.fill();
                
                // نقوش الجدار السايبربانك
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x + 10, y + 10); ctx.lineTo(x + cellSize - 10, y + cellSize - 10);
                ctx.moveTo(x + cellSize - 10, y + 10); ctx.lineTo(x + 10, y + cellSize - 10);
                ctx.stroke();
            } 
            else if (type === 'emitter') {
                ctx.save();
                ctx.translate(x + center, y + center);
                let angle = 0;
                if(emitter.dir.r === 0 && emitter.dir.c === 1) angle = 0;
                else if(emitter.dir.r === 1 && emitter.dir.c === 0) angle = Math.PI/2;
                else if(emitter.dir.r === 0 && emitter.dir.c === -1) angle = Math.PI;
                else if(emitter.dir.r === -1 && emitter.dir.c === 0) angle = -Math.PI/2;
                ctx.rotate(angle);
                
                // جسم المصدر
                ctx.fillStyle = '#cbd5e1';
                ctx.beginPath();
                ctx.roundRect(-cellSize/2 + 8, -cellSize/3, cellSize/2, cellSize/1.5, 4);
                ctx.fill();
                
                // نبض فوهة الليزر
                const glow = Math.abs(Math.sin(pulseTime * 3)) * 5;
                ctx.fillStyle = '#ef4444';
                ctx.shadowBlur = 10 + glow;
                ctx.shadowColor = '#ef4444';
                ctx.beginPath();
                ctx.moveTo(8, -8); ctx.lineTo(20, 0); ctx.lineTo(8, 8);
                ctx.fill();
                ctx.restore();
            }
            else if (type === 'target') {
                const pulse = Math.sin(pulseTime * 2) * 4;
                ctx.save();
                ctx.translate(x + center, y + center);
                
                const targetColor = isLevelComplete ? '#10b981' : '#f59e0b';
                ctx.shadowBlur = 15 + pulse;
                ctx.shadowColor = targetColor;
                
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, cellSize/3 + pulse/3, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = targetColor;
                ctx.beginPath();
                ctx.arc(0, 0, cellSize/5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            else if (type === 'mirror_slash' || type === 'mirror_backslash') {
                ctx.save();
                ctx.translate(x + center, y + center);
                
                const isFixed = grid[r][c].isFixed;
                const mirrorColor = isFixed ? '#64748b' : '#10b981'; // المرايا الثابتة رمادية، الخاصة باللاعب خضراء
                
                // قاعدة المرآة
                ctx.fillStyle = '#020617';
                ctx.beginPath();
                ctx.roundRect(-12, -12, 24, 24, 4);
                ctx.fill();

                if (type === 'mirror_slash') ctx.rotate(-Math.PI / 4);
                else ctx.rotate(Math.PI / 4);

                // الزجاج
                ctx.fillStyle = mirrorColor;
                ctx.shadowBlur = isFixed ? 5 : 15;
                ctx.shadowColor = mirrorColor;
                ctx.beginPath();
                ctx.roundRect(-2, -cellSize/2 + 8, 4, cellSize - 16, 2);
                ctx.fill();
                
                // اللمعة
                ctx.fillStyle = '#ffffff';
                ctx.globalAlpha = 0.8;
                ctx.fillRect(-1, -cellSize/4, 2, cellSize/2);
                
                ctx.restore();
            }
        }

        function drawLaser() {
            if (laserPath.length < 2) return;

            const glowIntensity = Math.abs(Math.sin(pulseTime * 4)) * 3;
            const laserColor = isLevelComplete ? '#10b981' : '#ef4444'; // يتحول للأخضر عند الفوز
            
            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            const passes = [
                { width: 8 + glowIntensity, alpha: 0.2 },
                { width: 4 + glowIntensity/2, alpha: 0.5 },
                { width: 2, alpha: 1 }
            ];

            passes.forEach(pass => {
                ctx.beginPath();
                ctx.lineWidth = pass.width;
                ctx.globalAlpha = pass.alpha;
                ctx.strokeStyle = laserColor;
                ctx.shadowBlur = pass.width * 2;
                ctx.shadowColor = laserColor;

                const startR = laserPath[0].r;
                const startC = laserPath[0].c;
                ctx.moveTo(startC * cellSize + cellSize/2, startR * cellSize + cellSize/2);

                for (let i = 1; i < laserPath.length; i++) {
                    const node = laserPath[i];
                    ctx.lineTo(node.c * cellSize + cellSize/2, node.r * cellSize + cellSize/2);
                }
                ctx.stroke();
            });
            ctx.globalAlpha = 1;

            // نقطة التوقف / الاصطدام
            const lastNode = laserPath[laserPath.length - 1];
            if (lastNode.r >= 0 && lastNode.r < rows && lastNode.c >= 0 && lastNode.c < cols) {
                const cellType = grid[lastNode.r][lastNode.c].type;
                if (cellType === 'wall' || cellType === 'target' || cellType === 'mirror_slash' || cellType === 'mirror_backslash') {
                    ctx.fillStyle = '#fff';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = laserColor;
                    ctx.beginPath();
                    ctx.arc(lastNode.c * cellSize + cellSize/2, lastNode.r * cellSize + cellSize/2, 4 + glowIntensity, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            pulseTime += 0.03;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    drawCell(r, c, grid[r][c].type);
                }
            }

            drawLaser();
            requestAnimationFrame(draw);
        }

        function closeModal() {
            modalOverlay.style.opacity = '0';
            modalContent.style.transform = 'scale(0.8)';
            setTimeout(() => {
                modalOverlay.style.display = 'none';
            }, 300);
        }

        function nextLevel() {
            closeModal();
            currentLevelIndex++;
            loadLevel(currentLevelIndex);
        }

        // تهيئة اللعبة
        loadLevel(0);
        requestAnimationFrame(draw);

    </script>
</body>
</html>
